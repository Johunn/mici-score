<style>
:root{
  --bg:#EDF1EE;--surface:#FFFFFF;--ink:#12262A;--muted:#566A6C;--line:#D3DCD8;
  --accent:#1F5C63;--on-accent:#FFFFFF;--good:#2F7D4F;--mid:#9A6A0F;--bad:#B23A32;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Figtree',system-ui,sans-serif;
  --navh:52px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root[data-theme="system"]{--bg:#0F1B1D;--surface:#172629;--ink:#E6EFEC;--muted:#94A9A9;--line:#2A3D40;--accent:#6CC3C9;--on-accent:#0F1B1D;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D}
}
:root[data-theme="dark"]{--bg:#0F1B1D;--surface:#172629;--ink:#E6EFEC;--muted:#94A9A9;--line:#2A3D40;--accent:#6CC3C9;--on-accent:#0F1B1D;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D}
:root[data-theme="ocean"]{--bg:#0B1626;--surface:#12233A;--ink:#E4EDF7;--muted:#8FA6C0;--line:#243A57;--accent:#5AA9E6;--on-accent:#07121F;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D}
:root[data-theme="charbon"]{--bg:#121212;--surface:#1E1E1E;--ink:#EDEDED;--muted:#A0A0A0;--line:#333333;--accent:#F2A93B;--on-accent:#1A1100;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D}
:root[data-theme="foret"]{--bg:#0E1A14;--surface:#15271E;--ink:#E3EFE7;--muted:#8FAA9A;--line:#25402F;--accent:#6FCF97;--on-accent:#07150D;--good:#6FCF97;--mid:#E0B04F;--bad:#E2756D}
:root[data-theme="amoled"]{--bg:#000000;--surface:#0E0E0E;--ink:#F5F5F5;--muted:#9A9A9A;--line:#262626;--accent:#5EEAD4;--on-accent:#00120F;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D}
:root[data-theme="mici"]{--bg:#FFF7F1;--surface:#FFFFFF;--ink:#2B1740;--muted:#6B5F78;--line:#E6D9E2;--accent:#512178;--on-accent:#FFFFFF;--hi:#BF9F00;--good:#2F7D4F;--mid:#8A6A00;--bad:#B23A32;--f-display:'Montserrat',system-ui,sans-serif;--f-body:'Montserrat',system-ui,sans-serif}
:root[data-theme="micinuit"]{--bg:#160D21;--surface:#231433;--ink:#F3EBF8;--muted:#B8A7C8;--line:#3A2750;--accent:#E0BE1A;--on-accent:#1A0F26;--hi:#E0BE1A;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D;--f-display:'Montserrat',system-ui,sans-serif;--f-body:'Montserrat',system-ui,sans-serif}
:root[data-theme="contraste"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#000000;--muted:#2B2B2B;--line:#000000;--accent:#0033CC;--on-accent:#FFFFFF;--good:#006B2D;--mid:#7A4B00;--bad:#B00020}
:root[data-theme="contraste"] .card,:root[data-theme="contraste"] .rows,:root[data-theme="contraste"] .row{border:2px solid #000}
/* Fond Aurore : halos colorés + cartes en verre dépoli (thèmes sombres) */
:root[data-theme="dark"],:root[data-theme="ocean"],:root[data-theme="charbon"],:root[data-theme="foret"],:root[data-theme="amoled"],:root[data-theme="micinuit"]{--glass:rgba(255,255,255,.07);--glassline:rgba(255,255,255,.12);--bf:blur(14px);--navbg:color-mix(in srgb,var(--surface) 75%,transparent)}
:root[data-theme="micinuit"]{--g1:rgba(132,56,206,.62);--g2:rgba(224,190,26,.22);--g3:rgba(196,48,150,.34)}
:root[data-theme="dark"]{--g1:rgba(31,140,150,.50);--g2:rgba(108,195,201,.18);--g3:rgba(40,90,170,.30)}
:root[data-theme="ocean"]{--g1:rgba(40,110,220,.50);--g2:rgba(90,169,230,.20);--g3:rgba(110,60,200,.30)}
:root[data-theme="charbon"]{--g1:rgba(242,169,59,.22);--g2:rgba(255,255,255,.06);--g3:rgba(200,90,60,.22)}
:root[data-theme="foret"]{--g1:rgba(40,150,90,.45);--g2:rgba(111,207,151,.18);--g3:rgba(30,110,120,.30)}
:root[data-theme="amoled"]{--g1:rgba(94,234,212,.20);--g2:rgba(120,90,230,.18);--g3:rgba(94,234,212,.12)}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--glass:rgba(255,255,255,.07);--glassline:rgba(255,255,255,.12);--bf:blur(14px);--navbg:color-mix(in srgb,var(--surface) 75%,transparent);--g1:rgba(31,140,150,.50);--g2:rgba(108,195,201,.18);--g3:rgba(40,90,170,.30)}}
:root[data-aurora="off"]{--g1:transparent!important;--g2:transparent!important;--g3:transparent!important;--glass:initial!important;--glassline:initial!important;--bf:initial!important;--navbg:initial!important}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 38% at 12% 2%,var(--g1,transparent),transparent 70%),radial-gradient(55% 32% at 105% 28%,var(--g2,transparent),transparent 72%),radial-gradient(80% 42% at -5% 96%,var(--g3,transparent),transparent 70%)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;margin-bottom:12px}
h3{font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rib{width:.6em;height:.8em;margin-left:9px;color:var(--ribbon,#8A4FBF);vertical-align:-.04em;flex:none}
.ibtn{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0;align-self:center}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
input[type=search],input[type=text],input[type=number],textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--glass,var(--surface));color:var(--ink);font:inherit}
input[type=number]::placeholder{color:var(--muted,var(--ink));opacity:.55}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:transparent;font-weight:500;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.group{margin-top:20px}
.group>h3{margin-bottom:8px;color:var(--muted);font-size:14px;font-weight:600}
.rows{background:var(--glass,var(--surface));border:1px solid var(--glassline,transparent);-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.sel{background:color-mix(in srgb,var(--accent) 16%,var(--glass,var(--surface)))}
.row.sel .name::before{content:'✓ ';color:var(--accent);font-weight:700}
body[data-layout="cartes"] .row.sel{background:color-mix(in srgb,var(--accent) 16%,var(--glass,var(--surface)));border-color:var(--accent)}
.row .name{flex:1;text-align:left;padding:13px 8px 13px 14px;background:none;border:0;font-weight:500;min-width:0}
.row .badge{align-self:center;margin:0 4px}
.row .info{flex:none;width:46px;background:none;border:0;border-left:1px solid var(--line);color:var(--accent);font-size:20px}
.badge{min-width:44px;text-align:center;padding:4px 8px;border-radius:8px;font:700 15px var(--f-display);border:1.5px solid currentColor;background:var(--surface)}
.good{color:var(--good)}.mid{color:var(--mid)}.bad{color:var(--bad)}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600}
.btn{display:inline-block;padding:13px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.block{width:100%}
.btn+.btn{margin-top:10px}
.card{background:var(--glass,var(--surface));border:1px solid var(--glassline,transparent);-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);border-radius:14px;padding:18px;margin-top:14px}
.dialwrap{text-align:center;padding:6px 0 0}
.dial{width:230px;max-width:80%;height:auto}
.dial .track{stroke:var(--line)}
.dial text.num{font:700 54px var(--f-display);fill:currentColor}
.dial text.max{font:500 15px var(--f-body);fill:var(--muted)}
.verdict{font:700 19px var(--f-display);margin-top:2px}
.pen{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;color:var(--ink)}
.pen span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;background:transparent;border:0;font-weight:500;font-size:14px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.field{margin-top:16px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.rangeval{font:700 20px var(--f-display)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navbg,var(--surface));-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;padding:14px 4px;background:none;border:0;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--hi,var(--accent))}
#bar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding:8px 12px;z-index:4;pointer-events:none}
#bar .wrap{display:flex;gap:8px;max-width:536px;margin:0 auto}
#bar .main{flex:1;min-width:0}
#bar .clr{background:var(--navbg,var(--surface));color:var(--ink);border:1.5px solid var(--line)!important;font-weight:600}
#bar button{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#bar .badge{color:var(--ink)}
#bar .grow{flex:1}
.notice{border-left:4px solid var(--mid);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);margin-top:14px}
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .body{flex:1;min-width:0}
.entry .del{background:none;border:0;color:var(--muted);padding:6px;font-size:14px;text-decoration:underline}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:600}
.item .x{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}
.meter{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.meter .nm{flex:0 0 150px}
.meter .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter .v{flex:0 0 30px;text-align:right;font-weight:600}
.lvgrid{display:grid;grid-template-columns:1fr 92px;gap:8px 12px;align-items:center}
.lvgrid select{padding:8px 10px}
.sens{margin-top:14px}
.sens label{display:flex;justify-content:space-between;font-weight:600}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.searchbox{position:relative}
.searchbox input{padding-right:48px}
.searchbox .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:18px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:transparent;font-weight:500;text-align:left}
.theme[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw{display:flex;border-radius:6px;overflow:hidden;width:100%;height:22px;border:1px solid var(--line)}
.sw i{flex:1}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colors input[type=color]{width:100%;height:44px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
body[data-layout="compact"] .row .name{padding:5px 6px 5px 10px;font-size:14px;line-height:1.25}
body[data-layout="compact"] .row .badge{font-size:13px;padding:1px 6px;min-width:36px}
body[data-layout="compact"] .row .info{width:34px;font-size:17px}
body[data-layout="compact"] .group{margin-top:10px}
body[data-layout="compact"] .group>h3{margin-bottom:4px}
body[data-layout="cartes"] .rows{background:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:visible;border-radius:0;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
body[data-layout="cartes"] .row{flex-direction:column;background:var(--glass,var(--surface));border:1px solid var(--glassline,var(--line));border-radius:12px;position:relative;overflow:hidden}
body[data-layout="cartes"] .row:last-child{border-bottom:1px solid var(--line)}
body[data-layout="cartes"] .row .name{padding:12px 44px 6px 12px;width:100%;min-height:64px}
body[data-layout="cartes"] .row .badge{align-self:flex-start;margin:0 12px 12px;font-size:20px}
body[data-layout="cartes"] .row .info{position:absolute;top:0;right:0;width:40px;height:40px;border:0}
.flag{font-size:13px;margin-left:6px;color:var(--mid)}
.flag.c{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.dial .arc{transition:stroke-dasharray .35s ease}}

const mixc=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v*(1-t)+y[i]*t))};
const THEME_VARS=['--bg','--surface','--ink','--muted','--line','--accent','--on-accent','--good','--mid','--bad','--g1','--g2','--g3','--glass','--glassline','--bf','--navbg'];
function applyTheme(){
  const r=document.documentElement;
  r.setAttribute('data-theme',store.theme);
  r.setAttribute('data-aurora',store.aurora?'on':'off');
  document.body.setAttribute('data-layout',store.layout);
  THEME_VARS.forEach(v=>r.style.removeProperty(v));
  if(store.theme==='custom'){
    const bg=store.cbg,ac=store.cac,dark=lum(bg)<0.4;
    const ink=dark?'#F2F2F2':'#14181A';
    const vals={'--bg':bg,'--surface':mixc(bg,dark?'#FFFFFF':'#FFFFFF',dark?0.07:0.7),'--ink':ink,'--muted':mixc(ink,bg,0.38),'--line':mixc(bg,ink,0.16),'--accent':ac,'--on-accent':lum(ac)>0.45?'#111111':'#FFFFFF',
      '--good':dark?'#5FBF86':'#2F7D4F','--mid':dark?'#E0B04F':'#9A6A0F','--bad':dark?'#E2756D':'#B23A32'};
    Object.keys(vals).forEach(k=>r.style.setProperty(k,vals[k]));
    if(dark){
      const rgba=(h,a)=>{const c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'};
      const sv={'--g1':rgba(ac,0.42),'--g2':rgba(ac,0.16),'--g3':rgba(mixc(ac,'#8844CC',0.55),0.28),'--glass':'rgba(255,255,255,.07)','--glassline':'rgba(255,255,255,.12)','--bf':'blur(14px)','--navbg':'color-mix(in srgb,var(--surface) 75%,transparent)'};
      Object.keys(sv).forEach(k=>r.style.setProperty(k,sv[k]));
    }
  }
  {let bgc=getComputedStyle(r).getPropertyValue('--bg').trim();let rc='#8A4FBF';if(/^#[0-9a-f]{6}$/i.test(bgc)){if(lum(bgc)<0.25)rc='#B58CE0';else if(store.theme==='contraste')rc='#5B1E8F'}r.style.setProperty('--ribbon',rc)}
  const m=document.querySelector('meta[name=theme-color]');
  if(m){const c=getComputedStyle(r).getPropertyValue('--accent').trim();if(c)m.setAttribute('content',c)}
}

function personalSingle(id){

/* Statuts d'aliments. « À surveiller » est calculé depuis le journal en comparant les bons et les mauvais repas ; il ne change pas le score. « Confirmé » et « écarté » sont des choix de l'utilisateur. */
const SUSP_MAX=4;
function foodStats(){
  const es=store.entries.filter(e=>Array.isArray(e.items)&&typeof e.r==='number'&&e.items.some(i=>i.id!=='legacy'));
  const per={};
  es.forEach(e=>{const seen={};e.items.forEach(it=>{if(it.id==='legacy'||seen[it.id])return;seen[it.id]=1;const o=per[it.id]=per[it.id]||{id:it.id,name:it.n,ms:[]};o.ms.push(e)})});
  const tot=es.length,sumAll=es.reduce((a,e)=>a+e.r,0);
  return Object.values(per).map(o=>{
    const n=o.ms.length,sw=o.ms.reduce((a,e)=>a+e.r,0),bad=o.ms.filter(e=>e.r<=4).length,good=o.ms.filter(e=>e.r>=7).length;
    const nWo=tot-n,meanWo=nWo>0?(sumAll-sw)/nWo:null;
    const rec=o.ms.slice().sort((a,b)=>b.ts-a.ts).slice(0,3),cleared=n>=4&&rec.length===3&&rec.every(e=>e.r>=7);
    return{id:o.id,name:o.name,n,bad,good,mean:sw/n,meanWo,nWo,cleared,gap:meanWo==null?null:meanWo-sw/n};
  });
}
function suspectList(){
  const fl=store.flags||{};
  return foodStats().filter(s=>!fl[s.id]&&!s.cleared&&s.bad>=2&&s.gap!=null&&s.gap>=1.5&&s.nWo>=3&&s.good<=s.bad*0.5).sort((a,b)=>b.gap-a.gap);
}
const suspectIds=()=>suspectList().slice(0,SUSP_MAX).map(s=>s.id);
const flagOf=(id,sus)=>(store.flags||{})[id]||((sus||suspectIds()).indexOf(id)>=0?'suspect':'');
const flagBadge=(id,sus)=>{const t=flagOf(id,sus);return t==='suspect'?'<span class="flag" title="À surveiller">⚠</span>':t==='confirm'?'<span class="flag c" title="Déclencheur confirmé">✖</span>':''};
function flagCard(f){
  const st=flagOf(f.id),s=foodStats().find(x=>x.id===f.id);
  const lab={suspect:'À surveiller',confirm:'Confirmé',clear:'Écarté'}[st]||'Neutre';
  const info=s?`Présent dans ${s.n} repas du journal (moyenne ${fmt(s.mean)}${s.meanWo!=null?`, contre ${fmt(s.meanWo)} sans lui`:''} ; ${s.bad} mauvais, ${s.good} bons).${s.cleared?' Ses 3 derniers repas sont bons : il n\u2019est plus signalé.':''}`:'Aucun repas du journal ne contient cet aliment.';
  const btn=(v,t)=>`<button class="btn ghost block" data-act="flag" data-id="${esc(f.id)}" data-v="${v}">${t}</button>`;
  return `<div class="card"><h3>Statut : ${lab}</h3>
    <p class="small muted">${info}</p>
    <p class="small muted">« À surveiller » ne change pas le score. « Confirmé » applique ta moyenne comme correction (modifiable). Pour trancher, retire l'aliment quelques jours, un changement à la fois.</p>
    <p style="margin:10px 0 0">${st==='confirm'||st==='clear'?btn('none','Retirer le statut'):btn('confirm','Confirmer comme déclencheur')+btn('clear','Écarter (hors de cause)')}</p></div>`;
}

function dial(v){
  const len=Math.PI*80,d=clamp(v,0,10)/10*len;
  return `<svg class="dial ${cls(v)}" viewBox="0 0 200 118" role="img" aria-label="MICI Score ${fmt(v)} sur 10">
    <path class="track" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round"/>
    <path class="arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-dasharray="${d} ${len+2}"/>
    <text class="num" x="100" y="96" text-anchor="middle">${fmt(v)}</text>
    <text class="max" x="100" y="116" text-anchor="middle">sur 10</text></svg>`;
}

const ATT=[{k:'g',lab:'Gras élevé',tip:'petite portion, sauce à part, cuisson sans matière grasse ajoutée',th:2},{k:'l',lab:'Lactose',tip:'version sans lactose ou petite portion',th:1.5},{k:'f',lab:'Fibres insolubles',tip:'bien cuire, éplucher ou mixer',th:2},{k:'h',lab:'Gaz possibles',tip:'retirer oignon, ail ou légumineuses, ou petite portion',th:2},{k:'e',lab:'Épices ou acidité',tip:'version plus douce',th:2},{k:'s',lab:'Stimulants',tip:'moins fort ou décaféiné, pas à jeun',th:2},{k:'c',lab:'Sucres concentrés',tip:'portion plus petite',th:2}];
function attentionHTML(lv){
  const L=[];
  FEATS.forEach((f,i)=>{const a=ATT.find(x=>x.k===f.k);if(a&&effL(f,i,lv)>=a.th)L.push(a)});
  if((lv.u||0)>=2)L.push({lab:'Ultra-transformé',tip:'version maison ou plus simple'});
  return `<div class="card"><h3>Points d\u2019attention</h3>${L.length?L.map(a=>`<p class="small" style="margin:0 0 8px"><b>${a.lab}</b> <span class="muted">· ${a.tip}</span></p>`).join(''):'<p class="small muted" style="margin:0">Aucun point d\u2019attention particulier. Reste attentif à la quantité et à tes notes.</p>'}<p class="small muted" style="margin:8px 0 0">Ce sont des pistes d\u2019adaptation, pas des interdits : ton journal décide.</p></div>`;
}

function listHTML(){
  const q=ui.qs.trim().toLowerCase(),so=ui.sort||'cat';
  const all=allFoods().filter(f=>(ui.cat<0||f.c===ui.cat)&&(!q||f.n.toLowerCase().includes(q)));
  if(so==='cat')all.sort((x,y)=>ORD.indexOf(x.c)-ORD.indexOf(y.c));
  else{
    const sc={};all.forEach(f=>{sc[f.id]=foodScore(f)});
    all.sort(so==='nom'?(x,y)=>COL.compare(x.n,y.n):so==='scd'?(x,y)=>(sc[y.id]-sc[x.id])||COL.compare(x.n,y.n):(x,y)=>(sc[x.id]-sc[y.id])||COL.compare(x.n,y.n));
  }
  if(!all.length)return `<div class="empty">Aucun aliment trouvé.<br><button class="link" data-act="newfood">Ajouter « ${esc(ui.qs)} »</button></div>`;
  const PS=100,pages=Math.ceil(all.length/PS);ui.page=Math.min(Math.max(0,ui.page||0),pages-1);
  const foods=all.slice(ui.page*PS,(ui.page+1)*PS),sus=suspectIds();
  const pager=pages>1?`<div class="seg" role="group" aria-label="Pages" style="margin:12px 0;align-items:center"><button data-act="pg" data-d="-1" ${ui.page===0?'disabled':''}>‹ Précédent</button><span class="small muted" style="padding:0 10px">Page ${ui.page+1} / ${pages} · ${all.length} aliments</span><button data-act="pg" data-d="1" ${ui.page>=pages-1?'disabled':''}>Suivant ›</button></div>`:'';
  const row=f=>{
    const v=foodScore(f),ov=store.over[f.id]!=null,sel=ui.plate.some(x=>x.id===f.id);
    return `<div class="row${sel?' sel':''}"><button class="name" data-act="add" data-id="${esc(f.id)}" aria-pressed="${sel}">${esc(f.n)}${flagBadge(f.id,sus)}</button><span class="badge ${cls(v)}" title="${ov?'Corrigé par toi':'Calculé'}">${fmt(v)}${ov?'*':''}</span><button class="info" data-act="info" data-id="${esc(f.id)}" aria-label="Détails de ${esc(f.n)}">›</button></div>`;
  };
  if(so!=='cat'){
    const lab=so==='nom'?'Par nom, A à Z':so==='scd'?'Du meilleur au moins bon score':'Du moins bon au meilleur score';
    return pager+`<section class="group"><h3>${lab} (${foods.length})</h3><div class="rows">${foods.map(row).join('')}</div></section>`+pager;
  }
  return pager+ORD.map(i=>{
    const c=CATS[i],g=foods.filter(f=>f.c===i);
    if(!g.length)return '';
    return `<section class="group"><h3>${c} (${g.length})</h3><div class="rows">${g.map(row).join('')}</div></section>`;
  }).join('')+pager;
}

function learning(){
  const es=store.entries.filter(e=>Array.isArray(e.L));
  const out=[];
  if(es.length<8)return{out,n:es.length};
  FEATS.forEach((f,i)=>{
    const hi=es.filter(e=>e.L[i]>=1.5),lo=es.filter(e=>e.L[i]<1.5);
    if(hi.length<3||lo.length<3)return;
    const m=a=>a.reduce((s,e)=>s+e.r,0)/a.length;
    const diff=m(lo)-m(hi),s=sensOf(f.k);
    if(diff>=2&&s<2)out.push({k:f.k,n:f.n,dir:1,txt:`Tes notes sont en moyenne ${fmt(diff)} points plus basses quand « ${f.n.toLowerCase()} » est élevé (${hi.length} repas contre ${lo.length}).`,to:Math.min(2,Math.round((s+0.25)*100)/100)});
    else if(diff<=0&&s>0.75&&hi.length>=5&&lo.length>=5)out.push({k:f.k,n:f.n,dir:-1,txt:`Aucun écart visible dans tes notes selon « ${f.n.toLowerCase()} » (${hi.length} repas contre ${lo.length}).`,to:Math.max(0.5,Math.round((s-0.25)*100)/100)});
  });
  return{out,n:es.length};
}

function sourcesHTML(){
  const A=(u,t)=>`<a href="${u}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${t}</a>`;
  return `<div class="card" style="margin-top:0"><h3>À lire en premier</h3>
    <p class="small">Le MICI Score est une estimation personnelle de la tolérance digestive, construite pour une rectocolite avec poche en J. Ce n'est ni un diagnostic, ni un traitement, ni un avis médical. Il n'a pas été validé cliniquement. Tes notes du journal priment toujours sur la grille.</p>
    <p class="small muted">Cet onglet explique d'où viennent les chiffres, pour qu'un médecin ou un diététicien puisse les vérifier et les corriger.</p></div>
  <div class="card"><h3>1. Comment le score est calculé</h3>
    <p class="small">Chaque aliment a des niveaux de 0 à 3 (par demi-point) pour des caractéristiques. Pénalité = somme(poids × ta sensibilité × multiplicateur du profil × niveau) + 0,3 × additifs − 0,5 × bonus épaississant (minimum 0). Score = 10 × exp(−pénalité / 9), donc entre 0 et 10 (10 = très bien toléré). La forme exponentielle évite que tous les plats gras tombent à 0 ; elle et le diviseur 9 sont arbitraires.</p>
    <p class="small muted">Poids en grammes : le facteur est poids saisi / poids de référence de la portion normale, plafonné entre ×0,1 et ×3. Références tirées de la table belge NUBEL « Poids et mesures » (Conseil supérieur de la Santé) pour œuf 50 g, jambon cuit 45 g, fromage fondu 20 g, fromage en tranche 25 g, filet de poulet 160 g, saumon 180 g, darne de cabillaud 175 g, riz cuit 150 g, frites 250 g, lasagnes 400 g, croque-monsieur 135 g, croissant 50 g, pomme 140 g, banane 130 g, mayonnaise et ketchup en cuillère 25 g ; le pain (80 g, trois tranches) et la demi-baguette (130 g) en sont déduits ; les autres références (légumes 150 g, viandes 120 g, boissons 200 g, etc.) sont des estimations sans source. Portion : trace ×0,3 (sauces et condiments, par défaut dans l'assiette), petite ×0,6, normale ×1, grosse ×1,5. Questran pris : gras ×0,75. À jeun : lactose ×1,3. Les niveaux d'une assiette s'additionnent (plafonnés à 4) : un sandwich de 6 ingrédients compte donc 6 portions, d'où des scores très bas si les portions ne sont pas réduites. Les poids affichés sous Trace, Petite, Normale et Grosse dans l'assiette sont la référence de la portion normale multipliée par le coefficient (arrondis à 5 g) : ce sont des estimations. Ces ajustements sont arbitraires.</p>
    <p class="small muted">Lecture : 6 ou plus généralement bien toléré ; 4 à 6 à adapter ; moins de 4 plusieurs points d'attention. Seuils abaissés parce que l'ancienne échelle (7 et 5, gras à 2,0, diviseur 6,5) classait 90 % des plats en rouge : elle était calibrée sur de mauvais repas seulement. Ces seuils ne sont pas validés. Le score affiché combine l'estimation et ta moyenne personnelle quand tu as des notes.</p></div>
  <div class="card"><h3>2. Caractéristiques, poids et niveau de preuve</h3>
    ${FEATS.map(f=>`<div style="margin:0 0 10px"><b class="small">${f.n} · poids ${fmt(f.w)}</b><span class="small muted" style="display:block">${f.d}</span><span class="small" style="display:block">Preuve : ${f.ev}</span><span class="small muted" style="display:block">${f.sr}</span></div>`).join('')}
    <div style="margin:0 0 10px"><b class="small">Additifs / ultra-transformés · poids 0,3</b><span class="small" style="display:block">Preuve : faible, estimation arbitraire</span><span class="small muted" style="display:block">ECCO 2025 : les ultra-transformés sont associés au développement de la maladie de Crohn, pas de la RCH. Crohn's &amp; Colitis UK : les données sur les additifs viennent d'études animales. Aucune donnée spécifique à la poche.</span></div>
    <div><b class="small">Bonus épaississant · −0,5 par niveau</b><span class="small" style="display:block">Preuve : opinion d'expert</span><span class="small muted" style="display:block">Riz blanc, banane, pomme de terre, féculents : cités comme épaississant les selles dans des fiches de diététique de poche (Hull NHS).</span></div></div>
  <div class="card"><h3>3. Profils</h3>
    <p class="small"><b>Poche en J</b> (défaut) : oligosaccharides à poids 0,3, fibres insolubles ×0,8. <b>Général</b> : barème sans ajustement (oligosaccharides à 1). <b>Sténose</b> (option) : fibres insolubles ×1,5. <b>Crohn</b> (option) : aucun effet sur le score.</p>
    <p class="small muted">Ces multiplicateurs sont des hypothèses de départ arbitraires. Aucune source ne donne de valeur chiffrée pour une poche. Les aliments déjà calibrés sur tes retours gardent leur poids d'origine.</p></div>
  <div class="card"><h3>4. Origine des niveaux par aliment</h3>
    <p class="small">Les ${FOODS.length} aliments viennent de connaissances générales (gras, lactose, fibres, FODMAP approximatifs). Aucun niveau n'est validé par une source par aliment. Le partage des fermentescibles entre oligosaccharides et fructose/polyols a été fait par règles de mots-clés (fructanes de l'oignon, de l'ail et du blé ; GOS des légumineuses ; polyols et fructose en excès des fruits, champignons et édulcorants). 65 % des aliments concernés ne correspondent à aucune règle et sont coupés 50/50 par défaut. La règle appliquée est visible dans la fiche de chaque aliment. Les additifs sont attribués par mots-clés (snacks, sodas light, biscuits, surgelés).</p>
    <p class="small muted">Les produits de marque n'ont pas leur composition exacte. Le score d'une assiette suppose des effets additifs ; l'ordre des aliments, la quantité exacte, le repas de la veille, le stress et la fatigue ne sont pas modélisés.</p></div>
  <div class="card"><h3>5. Personnalisation</h3>
    <p class="small">Tu peux corriger le score d'un aliment (il remplace le calcul), régler une sensibilité par caractéristique (×0,5 à ×2) et noter chaque repas de 0 à 10 dans le journal. Les suggestions d'apprentissage demandent au moins 8 repas avec détail et 3 par groupe. Ce sont des corrélations, pas des preuves : plusieurs aliments se mélangent dans un repas.</p>
    <p class="small"><b>Déclencheur personnel</b> : un aliment avec au moins 2 notes seul et une moyenne de 4 ou moins est signalé, même si la grille le classe favorable. En cas de désaccord entre la grille et ton journal, le journal prime.</p></div>
  <div class="card"><h3>Statuts d'aliments : à surveiller, confirmé, écarté</h3>
    <p class="small">Un aliment est « à surveiller » s'il figure dans au moins 2 repas notés 4 ou moins, si la moyenne des repas qui le contiennent est au moins 1,5 point sous celle des repas sans lui (au moins 3 repas sans lui), et si les repas notés 7 ou plus qui le contiennent ne dépassent pas la moitié des mauvais. Les bons repas comptent donc autant que les mauvais. Ces seuils sont arbitraires. Au plus 4 suspects sont affichés à la fois, pour éviter une restriction en cascade.</p>
    <p class="small muted">« À surveiller » ne change pas le score. « Confirmé » est ta décision : l'appli applique alors ta moyenne comme correction du score (modifiable). « Écarté » sort l'aliment de la liste. Le journal ne contrôle ni le Questran, ni le repas de la veille, ni le gras, le stress, la fatigue ou le délai entre le repas et les symptômes : c'est une corrélation, pas une preuve. Le seul vrai test est de retirer l'aliment quelques jours, un changement à la fois. Avec une poche, une restriction excessive expose à la perte de poids et aux carences : un diététicien MICI aide à la limiter. Le « déclencheur personnel » (2 notes seul, moyenne de 4 ou moins) reste un simple message dans la fiche, sans effet sur le score.</p></div>
  <div class="card"><h3>6. Sources</h3>
    <ul class="small muted" style="padding-left:18px;margin:0">
      <li>ECCO, Dietary Management of IBD (consensus 2025). ${A('https://ecco-ibd.eu/publications/news/issues/2025/volume-20-issue-4/dietary-management-of-inflammatory-bowel-disease-an-ecco-consensus','Synthèse ECCO News')} (texte complet non relu : PDF inaccessible). Alimentation saine de base ; low FODMAP recommandé pour symptômes de type SII en rémission ; preuves insuffisantes sur les fibres hors sténose ; pas de régime pour induire la rémission en RCH ; régime méditerranéen possible en maintenance de RCH ; accès à un diététicien MICI.</li>
      <li>AGA, Clinical Practice Update diet and nutritional therapies in IBD. ${A('https://gastro.org/clinical-guidance/diet-and-nutritional-therapies-in-patients-with-ibd/','gastro.org')} Régime méditerranéen conseillé ; aucun régime n'a prouvé qu'il réduit les poussées ; surveillance vitamine D, fer et B12 (résection iléale ou poche).</li>
      <li>Crohn's &amp; Colitis UK, Food and Crohn's or Colitis (2025). ${A('https://www.crohnsandcolitis.org.uk/info-support/information-about-crohns-and-colitis/all-information-about-crohns-and-colitis/living-with-crohns-or-colitis/food','crohnsandcolitis.org.uk')} Guide patient.</li>
      <li>NHS : fiches University Hospitals Sussex et Milton Keynes (Crohn), Hull University Teaching Hospitals (poche iléo-anale). ${A('https://www.hey.nhs.uk/patient-leaflet/eating-with-an-ileoanal-pouch/','Hull')} Guides patients ; la fiche de Hull associe oignon, ail, chou et légumineuses aux gaz, ballonnements et odeur.</li>
      <li>Ardalan et al., Aliment Pharmacol Ther 2021, revue narrative sur l'alimentation et la poche (preuves faibles). ${A('https://pubmed.ncbi.nlm.nih.gov/32955120/','PubMed')}</li>
      <li>Ardalan et al., JGH Open 2023 : Monash Pouch Diet, essai ouvert de 12 patients, sans groupe témoin. ${A('https://doi.org/10.1002/jgh3.13008','DOI')} Et JGH Open 2025 : essai randomisé en double aveugle arrêté tôt, effet sur la pochite non établi. ${A('https://pubmed.ncbi.nlm.nih.gov/41054558/','PubMed')}</li>
      <li>Résumé D-ECCO (Godny) sur la nutrition après poche : low FODMAP, selles médianes de 8 à 4 chez des patients sans pochite.</li>
    </ul></div>
  <div class="card"><h3>Fonction de la poche et pochite</h3>
    <p class="small muted">Deux sujets distincts. Fonction de la poche : fréquence, consistance, urgence, ballonnement ; les FODMAP peuvent l'influencer (ECCO 2025, preuve faible, données préliminaires). Pochite : les fruits sont associés à moins de pochite alors qu'ils peuvent augmenter les selles, donc un seul score ne peut pas couvrir les deux. Les FODMAP ne sont ni une cause ni un traitement de la pochite, et l'appli n'attribue aucun score alimentaire causal à la pochite.</p>
    <p class="small muted">Monash Pouch Diet : essai ouvert 2023 sur 12 patients (1 retrait pour obstruction partielle, tolérance excellente chez 9) ; essai randomisé en double aveugle 2025 arrêté tôt, tous les patients du bras Monash aggravés, effet sur la pochite non établi. Ce régime augmente les oligosaccharides fermentescibles, à l'inverse d'un régime pauvre en FODMAP. Hypothèse à tester, jamais un traitement validé.</p></div>
  <div class="card"><h3>Non pris en compte dans l'appli</h3>
    <p class="small muted">Régimes d'exclusion et nutrition entérale (interventions thérapeutiques encadrées par un diététicien), compléments, probiotiques, curcumine et régime sans gluten. Ne pas les démarrer sans avis médical.</p></div>
  <div class="card"><h3>7. Ce qui n'est pas démontré</h3>
    <ul class="small muted" style="padding-left:18px;margin:0">
      <li>Le lien gras → acides biliaires → selles avec une poche, et l'effet du Questran sur la poche : preuve insuffisante. Le Questran n'est jamais présenté comme un traitement standard de la poche : à discuter uniquement avec le gastro-entérologue ; surveillance nutritionnelle si prescrit.</li>
      <li>L'effet des oligosaccharides, du fructose et des polyols sur la poche : preuve faible ou insuffisante.</li>
      <li>L'effet de la cuisson sur les fructanes, de l'alcool et de la bière sur les selles en poche, des ultra-transformés sur la poche : preuve insuffisante.</li>
      <li>Le Monash Pouch Diet est une hypothèse à tester, jamais un traitement validé.</li>
      <li><b>Ce score n'est pas un outil validé.</b> Une revue systématique de 2025 sur les indices de qualité alimentaire (référence rapportée par une source secondaire, non vérifiée par moi) conclut qu'aucun indice n'est validé pour les MICI, et il n'existe pas d'indice ni de « feu tricolore » publié et validé pour la RCH ou la poche. Ce qui s'en approche le plus évalue la qualité de l'alimentation, pas la tolérance d'un aliment.</li>
      <li><b>Effet de la quantité</b> : la dépendance à la portion est démontrée pour les FODMAP (seuils par portion, Varney et al., J Gastroenterol Hepatol 2017, établis surtout dans le syndrome de l'intestin irritable). Pas de courbe dose-réponse validée pour la poche, ni pour le gras ou les fibres. Les coefficients de portion de l'appli (trace 0,3, petite 0,6, grosse 1,5) sont arbitraires.</li>
      <li><b>Calibrage des seuils</b> : les seuils de couleur (vert dès 6, rouge sous 4) et le diviseur 9 sont des choix de lecture, pas des valeurs sourcées. Ils ont été abaissés parce que la première échelle classait 90 % des plats en rouge.</li>
      <li>Aucune fréquence de dosage de B12, fer, vitamine D ou vitamines liposolubles n'est affichée : il n'existe pas de fréquence universelle validée ; c'est le gastro-entérologue qui la fixe.</li>
      <li>Le texte exact du statement ECCO 25.1 sur les FODMAP et la poche n'a pas pu être vérifié.</li>
    </ul></div>
  <div class="card"><h3>Ruban violet</h3>
    <p class="small muted">Le ruban violet près du titre symbolise la sensibilisation aux MICI (la Journée mondiale des MICI a lieu le 19 mai ; source : afa Crohn RCH France). C'est un ruban générique, pas le logo d'une association, et l'appli n'est affiliée à aucune association.</p></div>
  <div class="card"><h3>8. Limites et sécurité</h3>
    <p class="small muted">Aucune étude ne valide ce score. L'application ne détecte ni pochite ni déshydratation. Consulte rapidement en cas de fièvre, déshydratation, sang important, douleurs importantes, ballonnement avec arrêt des gaz et des selles, augmentation brutale des selles, perte de poids ou fuites nocturnes. Un diététicien MICI est recommandé avant tout régime restrictif. Un régime pauvre en FODMAP, s'il était utilisé pour un SII, serait temporaire, en phases et suivi par un diététicien, jamais permanent.</p></div>
  <div class="card"><h3>Pour mon médecin</h3>
    <p class="small muted">Questions à discuter : mon nombre de selles par jour est-il normal pour ma poche, et quel seuil doit me faire consulter ? Le Questran est-il adapté (dose maximale, espacement des autres médicaments, suivi des vitamines A, D, E, K, du folate et du temps de prothrombine) ? Quelle fréquence de suivi pour la B12, le fer et la vitamine D ? Le lopéramide est-il autorisé ? Quelle hydratation et quelle solution de réhydratation ? Un test de malabsorption des acides biliaires ou d'intolérance au lactose est-il utile ? Un diététicien MICI est-il accessible ? Alcool et bière ? Dépistage de la fragilité osseuse ?</p></div>`;
}
/* Navigation : le bouton Retour d'Android remonte d'un écran dans l'appli (liste, détail, assiette, onglets) au lieu de quitter la page. */
let fromPop=false,navDepth=0;
const navKey=()=>ui.tab+'|'+ui.view+'|'+(ui.view==='detail'?ui.sel:'');
let lastKey=navKey();
try{history.replaceState({tab:ui.tab,view:ui.view,sel:ui.sel},'')}catch(e){}
window.addEventListener('popstate',e=>{
  const s=e.state;navDepth=Math.max(0,navDepth-1);fromPop=true;
  if(s&&s.tab){ui.tab=s.tab;ui.view=s.view;ui.sel=s.sel}else{ui.tab='calc';ui.view='list';ui.sel=null}
  ui.msg='';lastKey=navKey();render();fromPop=false;
});
function render(keep){
  const k=navKey();
  if(k!==lastKey){lastKey=k;if(!fromPop){try{history.pushState({tab:ui.tab,view:ui.view,sel:ui.sel},'');navDepth++}catch(e){}}}
  const y=window.scrollY;
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  app.innerHTML=ui.tab==='calc'?calcHTML():ui.tab==='journal'?journalHTML():ui.tab==='sources'?sourcesHTML():profilHTML();
  updateBar();
  window.scrollTo(0,keep?y:0);
}

/* ---------- Événements ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  ui.tab=b.dataset.tab;ui.msg='';ui.resetArmed=false;
  if(ui.tab==='calc'&&ui.view==='add')ui.view='list';
  render();
});

document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.gi!=null){const i=+t.dataset.gi;if(ui.plate[i]){ui.plate[i].g=Math.max(0,Math.min(1500,Math.round(+t.value||0)));render(true)}}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qs'){ui.qs=t.value;ui.page=0;document.getElementById('list').innerHTML=listHTML();const cb=document.querySelector('.searchbox .clear');if(cb)cb.hidden=!t.value}
  else if(t.id==='ress'){ui.ress=+t.value;document.getElementById('ressv').textContent=t.value}
  else if(t.id==='note'){ui.note=t.value}
  else if(t.id==='eress'){ui.eR=+t.value;const v=document.getElementById('eressv');if(v)v.textContent=t.value}
  else if(t.id==='enote'){ui.eNote=t.value}
  else if(t.id==='newName'){ui.newName=t.value}
  else if(t.id==='ov'){ui.ov=+t.value;document.getElementById('ovv').textContent=fmt(ui.ov)}
  else if(t.id==='cbg'){store.cbg=t.value;save();applyTheme()}
  else if(t.id==='cac'){store.cac=t.value;save();applyTheme()}
  else if(t.dataset&&t.dataset.k&&t.id.indexOf('s-')===0){
    store.sens[t.dataset.k]=+t.value;save();
    document.getElementById('sv-'+t.dataset.k).textContent='×'+fmt(+t.value);
  }
});

function refreshPrev(){
  const prev=clamp(rawScore(levels([{f:{L:ui.newL,b:ui.newB},p:1}])),0,10);
  const el=document.getElementById('prev');if(el){el.textContent=fmt(prev);el.className=cls(prev)}
}
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='quest'){ui.quest=t.checked;render(true)}
  else if(a==='jeun'){ui.jeun=t.checked;render(true)}
  else if(a==='aurora'){store.aurora=t.checked;save();applyTheme();render(true)}
  else if(a==='nl'){ui.newL[+t.dataset.i]=+t.value;refreshPrev()}
  else if(a==='nb'){ui.newB=+t.value;refreshPrev()}
  else if(t.id==='newCat'){ui.newCat=+t.value}
});

function openDetail(id){ui.sel=id;ui.view='detail';ui.msg='';const f=byId(id);ui.ov=f?Math.round(foodScore(f)*2)/2:5;render()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||(b.tagName==='INPUT'&&b.type!=='checkbox')||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='add'){
    const i=ui.plate.findIndex(x=>x.id===id),row=b.closest('.row');
    if(i>=0){ui.plate.splice(i,1);row.classList.remove('sel');b.setAttribute('aria-pressed','false')}
    else{ui.plate.push({id,p:defP(id)});row.classList.add('sel');b.setAttribute('aria-pressed','true')}
    updateBar();
  }
  else if(a==='clearq'){ui.qs='';ui.page=0;const q=document.getElementById('qs');q.value='';document.getElementById('list').innerHTML=listHTML();b.hidden=true;q.focus()}
  else if(a==='info'){openDetail(id)}
  else if(a==='addDetail'){const i=ui.plate.findIndex(x=>x.id===id);if(i>=0){ui.plate.splice(i,1);ui.msg='Retiré de l\u2019assiette.'}else{ui.plate.push({id,p:defP(id)});ui.msg='Ajouté à l\u2019assiette.'}render(true)}
  else if(a==='openPlate'){ui.view='plate';render()}
  else if(a==='clearBar'){ui.plate=[];document.querySelectorAll('.row.sel').forEach(r=>{r.classList.remove('sel');const n=r.querySelector('.name');if(n)n.setAttribute('aria-pressed','false')});updateBar()}
  else if(a==='back'){if(navDepth>0){history.back()}else{ui.view='list';ui.msg='';render()}}
  else if(a==='cat'){ui.cat=+b.dataset.i;ui.page=0;render(true)}
  else if(a==='sort'){ui.sort=id;store.sort=id;save();ui.page=0;render(true)}
  else if(a==='pg'){ui.page=Math.max(0,(ui.page||0)+(+b.dataset.d));document.getElementById('list').innerHTML=listHTML();window.scrollTo(0,0)}
  else if(a==='pp'){const it=ui.plate[+b.dataset.i];it.p=+b.dataset.v;it.g=0;render(true)}
  else if(a==='rm'){ui.plate.splice(+b.dataset.i,1);if(!ui.plate.length)ui.view='list';render(true)}
  else if(a==='clearPlate'){ui.plate=[];ui.view='list';ui.note='';ui.ress=7;render()}
  else if(a==='saveEntry'){
    const items=plateItems();if(!items.length)return;
    const r=scoreOf(items,ui);
    store.entries.push({id:Date.now(),ts:Date.now(),items:items.map(x=>({id:x.f.id,n:x.f.n,p:x.p,g:x.g||0})),r:ui.ress,quest:ui.quest,jeun:ui.jeun,note:ui.note.trim(),L:r.lv.L,score:r.score});
    save();ui.plate=[];ui.view='list';ui.note='';ui.ress=7;ui.tab='journal';render();
  }
  else if(a==='editEntry'){const e=store.entries.find(x=>String(x.id)===id);if(e){ui.editId=e.id;ui.eR=e.r;ui.eNote=e.note||''}render(true)}
  else if(a==='cancelEdit'){ui.editId=null;render(true)}
  else if(a==='saveEdit'){const e=store.entries.find(x=>String(x.id)===id);if(e){e.r=ui.eR;e.note=(ui.eNote||'').trim();e.edited=Date.now()}ui.editId=null;save();render(true)}
  else if(a==='delEntry'){store.entries=store.entries.filter(x=>String(x.id)!==id);save();render(true)}
  else if(a==='saveOv'){store.over[id]=ui.ov;save();ui.msg='Correction enregistrée.';render(true)}
  else if(a==='useMean'){store.over[id]=Math.round(+b.dataset.v*2)/2;ui.ov=store.over[id];save();ui.msg='Moyenne appliquée.';render(true)}
  else if(a==='resetOv'){delete store.over[id];save();const f=byId(id);ui.ov=f?Math.round(single(f)*2)/2:5;ui.msg='Calcul rétabli.';render(true)}
  else if(a==='newfood'){ui.view='add';ui.msg='';ui.newName=ui.qs.trim();ui.newCat=Math.max(0,ui.cat);ui.newL=[0,0,0,0,0,0,0];ui.newB=0;render()}
  else if(a==='saveFood'){
    const name=ui.newName.trim();
    if(!name){ui.msg='Saisis un nom.';render(true);return}
    const nid='perso-'+Date.now();
    store.custom.push({id:nid,n:name,c:ui.newCat,L:ui.newL.slice(),b:ui.newB});
    save();ui.qs='';ui.msg='';openDetail(nid);
  }
  else if(a==='delFood'){
    store.custom=store.custom.filter(x=>x.id!==id);delete store.over[id];if(store.flags)delete store.flags[id];ui.plate=ui.plate.filter(x=>x.id!==id);save();ui.view='list';render();
  }
  else if(a==='flag'){
    const v=b.dataset.v;store.flags=store.flags||{};
    if(v==='none'){delete store.flags[id];ui.msg='Statut retiré. La correction de score éventuelle reste : tu peux la rétablir.'}
    else{
      store.flags[id]=v;
      if(v==='confirm'){
        const f=byId(id),st=foodStats().find(x=>x.id===id);
        if(f&&st&&store.over[id]==null){store.over[id]=Math.max(0,Math.round(Math.min(single(f),st.mean)*2)/2);ui.ov=store.over[id];ui.msg='Confirmé : score corrigé à '+fmt(store.over[id])+' (modifiable plus bas).'}
        else ui.msg='Confirmé.';
      }else ui.msg='Écarté de la liste des suspects.';
    }
    save();render(true);
  }
  else if(a==='theme'){store.theme=id;save();applyTheme();render(true)}
  else if(a==='layout'){store.layout=id;save();applyTheme();render(true)}
  else if(a==='applySens'){store.sens[b.dataset.k]=+b.dataset.v;save();render(true)}
  else if(a==='share'){const url='https://johunn.github.io/mici-score/',d={title:'MICI Score',text:'MICI Score : estimation personnelle de la tolérance alimentaire (rectocolite avec poche en J). Ni diagnostic ni traitement.',url};if(navigator.share){navigator.share(d).catch(()=>{})}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>{ui.msg='Lien copié.';render(true);setTimeout(()=>{if(ui.msg==='Lien copié.'){ui.msg='';render(true)}},2500)},()=>{ui.msg='Copie impossible. Lien : '+url;render(true)})}else{ui.msg='Lien : '+url;render(true)}}
  else if(a==='prof'){store.prof=id;save();render(true)}
  else if(a==='mod'){store.mods=store.mods||{};store.mods[id]=!store.mods[id];save();render(true)}
  else if(a==='resetSens'){store.sens={};save();render(true)}
  else if(a==='export'){
    const txt=JSON.stringify(store);
    const done=()=>{ui.msg='Sauvegarde copiée.';render(true)},fail=()=>{ui.msg='Copie impossible sur ce navigateur.';render(true)};
    try{navigator.clipboard.writeText(txt).then(done,fail)}catch(err){fail()}
  }
  else if(a==='import'){
    const raw=(document.getElementById('imp').value||'').trim();
    try{
      const p=JSON.parse(raw);
      if(!p||!Array.isArray(p.entries))throw 0;
      store=norm(p);save();applyTheme();ui.msg='Sauvegarde restaurée.';
    }catch(err){ui.msg='Texte invalide. Colle la sauvegarde complète.'}
    render(true);
  }
  else if(a==='reset'){
    if(!ui.resetArmed){ui.resetArmed=true;render(true);return}
    store=norm({});save();applyTheme();ui.plate=[];ui.resetArmed=false;ui.msg='Données effacées.';render(true);
  }
});

applyTheme();
render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
