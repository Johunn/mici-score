}
:root[data-theme="dark"]{--bg:#0F1B1D;--surface:#172629;--ink:#E6EFEC;--muted:#94A9A9;--line:#2A3D40;--accent:#6CC3C9;--on-accent:#0F1B1D;--good:#5FBF86;--mid:#E0B04F;--bad:#E2756D}

/* Harmonise les menus natifs avec le thème : évite le texte clair sur fond blanc. */
:root{color-scheme:light}

body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 38% at 12% 2%,var(--g1,transparent),transparent 70%),radial-gradient(55% 32% at 105% 28%,var(--g2,transparent),transparent 72%),radial-gradient(80% 42% at -5% 96%,var(--g3,transparent),transparent 70%)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:10px 16px 20px}
#appfoot{max-width:560px;margin:0 auto;padding:0 16px calc(130px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;line-height:1.5;color:var(--muted)}
#appfoot a,.card a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;margin-bottom:12px}
h3{font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.searchbox input:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.item .seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;border:0;overflow:visible}
.item .seg button{min-width:0;min-height:54px;padding:8px 3px;border:1px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.2}
.item .seg button+button{border-left:1px solid var(--line)}
.item .seg button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.item .seg button small{margin-top:5px;color:var(--muted);font-size:11px!important}
@media(max-width:380px){.item .seg{gap:3px}.item .seg button{font-size:12px;padding:7px 1px}}
.rib{width:.6em;height:.8em;margin-left:9px;color:var(--ribbon,#8A4FBF);vertical-align:-.04em;flex:none}
.ibtn{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0;align-self:center}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
input[type=search],input[type=text],input[type=number],textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--glass,var(--surface));color:var(--ink);font:inherit}
select option{background-color:var(--surface);color:var(--ink)}

input[type=number]::placeholder{color:var(--muted,var(--ink));opacity:.55}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:transparent;font-weight:500;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.group{margin-top:20px}
.group>h3{margin-bottom:8px;color:var(--muted);font-size:14px;font-weight:600}
.rows{background:var(--glass,var(--surface));border:1px solid var(--glassline,transparent);-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.sel{background:color-mix(in srgb,var(--accent) 16%,var(--glass,var(--surface)))}
.row.sel .name::before{content:'✓ ';color:var(--accent);font-weight:700}
body[data-layout="cartes"] .row.sel{background:color-mix(in srgb,var(--accent) 16%,var(--glass,var(--surface)));border-color:var(--accent)}
.row .name{flex:1;text-align:left;padding:13px 8px 13px 14px;background:none;border:0;font-weight:500;min-width:0}
.row .badge{align-self:center;margin:0 4px}
.row .info{flex:none;width:46px;background:none;border:0;border-left:1px solid var(--line);color:var(--accent);font-size:20px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;text-align:center;padding:5px 9px;border-radius:999px;font:800 14px/1.15 var(--f-display);font-variant-numeric:tabular-nums;border:1px solid currentColor;background:color-mix(in srgb,currentColor 13%,var(--surface));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

.good{color:var(--good)}.mid{color:var(--mid)}.bad{color:var(--bad)}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600}
.btn{display:inline-block;padding:13px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.block{width:100%}
.btn+.btn{margin-top:10px}
.card{background:var(--glass,var(--surface));border:1px solid var(--glassline,transparent);-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);border-radius:14px;padding:18px;margin-top:14px}
.dialwrap{text-align:center;padding:6px 0 0}
.dial{width:230px;max-width:80%;height:auto}
.dial .track{stroke:var(--line)}
.dial text.num{font:700 54px var(--f-display);fill:currentColor}
.dial text.max{font:500 15px var(--f-body);fill:var(--muted)}
.verdict{font:700 19px var(--f-display);margin-top:2px}
.pen{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;color:var(--ink)}
.pen span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;background:transparent;border:0;font-weight:500;font-size:14px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.field{margin-top:16px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:500}

.rangeval{font:700 20px var(--f-display)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--navbg,var(--surface));-webkit-backdrop-filter:var(--bf,none);backdrop-filter:var(--bf,none);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

nav.tabs button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--hi,var(--accent))}
#bar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding:8px 12px;z-index:4;pointer-events:none}

#bar .clr{background:var(--navbg,var(--surface));color:var(--ink);border:1.5px solid var(--line)!important;font-weight:600}
#bar button{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#bar .badge{color:var(--ink)}
#bar .grow{flex:1}
.notice{border-left:4px solid var(--mid);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);margin-top:14px}
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.recent-meals{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.recent-meals .exp-section-head{margin-bottom:12px}
.recent-meals .exp-section-head h2{font-size:24px}

.meal-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meal-actions .btn{margin-top:0!important}
@media(max-width:420px){.recent-meals .exp-row{align-items:flex-start;flex-wrap:wrap}.recent-meals .exp-row-main{min-width:calc(100% - 70px)}.recent-meals .exp-row>.btn{margin-left:auto}.meal-actions{flex-direction:column;align-items:stretch}.meal-actions .btn{width:100%}}
.entry .body{flex:1;min-width:0}
.entry .del{background:none;border:0;color:var(--muted);padding:6px;font-size:14px;text-decoration:underline}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:600}
.item .x{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}

.meter .nm{flex:0 0 150px}

.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter .v{flex:0 0 30px;text-align:right;font-weight:600}
.lvgrid{display:grid;grid-template-columns:1fr 92px;gap:8px 12px;align-items:center}
.lvgrid select{padding:8px 10px}
.sens{margin-top:14px}
.sens label{display:flex;justify-content:space-between;font-weight:600}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.catalog-tools{display:grid;grid-template-columns:minmax(0,1fr) 132px;align-items:center;gap:8px}
.searchbox{position:relative;min-width:0}
.searchbox input{height:44px;padding:8px 42px 8px 12px;border-radius:12px;font-size:14px;box-shadow:none}
.searchbox input:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:1px;box-shadow:none}
.catalog-sort{min-width:0}
.catalog-sort select{height:44px;padding:8px 10px;border-radius:12px;font-size:13px}

.searchbox .clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:18px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:transparent;font-weight:500;text-align:left}
.theme[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw{display:flex;border-radius:6px;overflow:hidden;width:100%;height:22px;border:1px solid var(--line)}

body[data-layout="compact"] .row .name{padding:5px 6px 5px 10px;font-size:14px;line-height:1.25}

/* Tableau de bord orienté tâches : les actions précèdent le catalogue. */
.home-hero{position:relative;overflow:hidden;padding:24px 20px 20px;border-radius:24px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 28%,var(--surface)),var(--surface) 76%);border:1px solid var(--line);margin:2px 0 14px}

/* Validation stricte des sauvegardes importées : ne jamais injecter de données JSON
   directement dans le modèle de données de l'application. */
function validateBackup(p){
  const fail=()=>{throw new Error('invalid-backup')};
  const record=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  const num=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
  const text=(v,max,nonempty=false)=>typeof v==='string'&&v.length<=max&&(!nonempty||v.trim().length>0);
  const id=v=>text(v,200,true)&&/^[A-Za-z0-9][A-Za-z0-9_-]{0,199}$/.test(v)&&!['constructor','prototype','toString','valueOf','hasOwnProperty','isPrototypeOf','propertyIsEnumerable','__defineGetter__','__defineSetter__','__lookupGetter__','__lookupSetter__'].includes(v);
  const date=v=>Number.isSafeInteger(v)&&v>=0&&v<=8640000000000000;
  const map=(v)=>record(v);
  const arrNums=(v,n,min,max)=>Array.isArray(v)&&v.length===n&&v.every(x=>num(x,min,max));
  if(!record(p)||!Array.isArray(p.entries)||p.entries.length>10000)fail();
  ['custom','over','sens','mods','flags','del'].forEach(k=>{if(p[k]!==undefined&&(k==='custom'?!Array.isArray(p[k]):!map(p[k])))fail()});
  if(p.custom&&p.custom.length>1000)fail();

  const custom=(p.custom||[]).map(f=>{
    if(!record(f)||!id(f.id)||!text(f.n,200,true)||!Number.isInteger(f.c)||f.c<0||f.c>=CATS.length||!arrNums(f.L,7,0,3)||!num(f.b,0,2))fail();
    const o={id:f.id,n:f.n.trim(),c:f.c,L:f.L.slice(),b:f.b};
    if(f.obs!==undefined){if(typeof f.obs!=='boolean')fail();o.obs=f.obs}
    ['ho','u'].forEach(k=>{if(f[k]!==undefined){if(!num(f[k],0,4))fail();o[k]=f[k]}});
    ['rf','ru'].forEach(k=>{if(f[k]!==undefined){if(!text(f[k],20)||!(f[k]===''||Object.prototype.hasOwnProperty.call(RULES,f[k])))fail();o[k]=f[k]}});
    if(f.comp!==undefined){if(!text(f.comp,2000))fail();o.comp=f.comp}
    return o;
  });
  if(new Set(custom.map(f=>f.id)).size!==custom.length||custom.some(f=>FOODS.some(base=>base.id===f.id)))fail();

  const entries=p.entries.map(e=>{
    if(!record(e))fail();
    let eid=e.id;
    if(typeof eid==='string'&&/^[0-9]{1,16}$/.test(eid))eid=Number(eid);
    const ts=e.ts===undefined?eid:(typeof e.ts==='string'&&/^[0-9]{1,16}$/.test(e.ts)?Number(e.ts):e.ts);
    if(!Number.isSafeInteger(eid)||eid<0||!date(ts)||!num(e.r,0,10))fail();
    ['jeun','j'].forEach(k=>{if(e[k]!==undefined&&typeof e[k]!=='boolean')fail()});
    let sourceItems=e.items;
    /* Compatibilité avec les anciennes sauvegardes à un seul aliment par entrée. */
    if(!Array.isArray(sourceItems)&&text(e.name,200,true)){
      sourceItems=[{id:'legacy',n:e.name,p:Number.isInteger(e.p)&&e.p>=0&&e.p<=3?e.p:1,g:0}];
    }
    if(!Array.isArray(sourceItems)||sourceItems.length>250)fail();
    const items=sourceItems.map(it=>{
      if(!record(it)||!id(it.id)||!text(it.n,200,true))fail();
      const portion=it.p===undefined?1:it.p,grams=it.g===undefined?0:it.g;
      if(!Number.isInteger(portion)||portion<0||portion>3||!num(grams,0,1500))fail();
      return{id:it.id,n:it.n,p:portion,g:grams};
    });
    const o={id:eid,ts,items,r:e.r,jeun:e.jeun===true||e.j===true,note:e.note===undefined?'':e.note};
    if(!text(o.note,10000))fail();
    if(e.L===null||e.L===undefined)o.L=null;else{if(!arrNums(e.L,7,0,4))fail();o.L=e.L.slice()}
    if(e.score!==undefined){if(!num(e.score,0,10))fail();o.score=e.score}
    if(e.edited!==undefined){if(!date(e.edited))fail();o.edited=e.edited}
    return o;
  });
  if(new Set(entries.map(e=>e.id)).size!==entries.length)fail();

  const over={};
  Object.keys(p.over||{}).forEach(k=>{if(!id(k)||!num(p.over[k],0,10))fail();over[k]=p.over[k]});
  const sens={};
  const featureKeys=['g','l','f','h','e','s','c'];
  Object.keys(p.sens||{}).forEach(k=>{if(!featureKeys.includes(k)||!num(p.sens[k],0.5,2))fail();sens[k]=p.sens[k]});
  const mods={};
  Object.keys(p.mods||{}).forEach(k=>{if(!['sten','crohn'].includes(k)||typeof p.mods[k]!=='boolean')fail();mods[k]=p.mods[k]});
  const flags={};
  Object.keys(p.flags||{}).forEach(k=>{if(!id(k)||!['suspect','confirm','clear'].includes(p.flags[k]))fail();flags[k]=p.flags[k]});
  const del={};
  Object.keys(p.del||{}).forEach(k=>{if(!id(k)||!date(p.del[k]))fail();del[k]=p.del[k]});

  const themes=['system','dark','ocean','charbon','amoled','micinuit','mici','custom'];
  if(p.theme!==undefined&&!themes.includes(p.theme))fail();
  if(p.layout!==undefined&&!['liste','compact','cartes'].includes(p.layout))fail();
  if(p.sort!==undefined&&!['cat','nom','scd','sca'].includes(p.sort))fail();
  if(p.cbg!==undefined&&!/^#[0-9a-f]{6}$/i.test(p.cbg))fail();
  if(p.cac!==undefined&&!/^#[0-9a-f]{6}$/i.test(p.cac))fail();
  ['aurora','onb'].forEach(k=>{if(p[k]!==undefined&&typeof p[k]!=='boolean')fail()});
  ['ep','mt'].forEach(k=>{if(p[k]!==undefined&&!date(p[k]))fail()});

  /* Retourner uniquement les propriétés reconnues : ne pas recopier des clés JSON inconnues. */
  return {
    custom,entries,over,sens,mods,flags,del,
    prof:p.prof,
    theme:p.theme,
    layout:p.layout,
    sort:p.sort,
    cbg:p.cbg,
    cac:p.cac,
    ver:p.ver,
    aurora:p.aurora,
    onb:p.onb,
    ep:p.ep,
    mt:p.mt,
    acct:null
  };
}
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const lum=h=>{const c=hex2rgb(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]};
const mixc=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v*(1-t)+y[i]*t))};
const THEME_VARS=['--bg','--surface','--ink','--muted','--line','--accent','--on-accent','--good','--mid','--bad','--g1','--g2','--g3','--glass','--glassline','--bf','--navbg'];
function applyTheme(){

  document.body.setAttribute('data-layout',store.layout);
  THEME_VARS.forEach(v=>r.style.removeProperty(v));
  if(store.theme==='custom'){
    const bg=store.cbg,ac=store.cac,dark=lum(bg)<0.4;
    r.style.colorScheme=dark?'dark':'light';
    const ink=dark?'#F2F2F2':'#14181A';
    const vals={'--bg':bg,'--surface':mixc(bg,dark?'#FFFFFF':'#FFFFFF',dark?0.07:0.7),'--ink':ink,'--muted':mixc(ink,bg,0.38),'--line':mixc(bg,ink,0.16),'--accent':ac,'--on-accent':lum(ac)>0.45?'#111111':'#FFFFFF',
      '--good':dark?'#5FBF86':'#2F7D4F','--mid':dark?'#E0B04F':'#9A6A0F','--bad':dark?'#E2756D':'#B23A32'};
    Object.keys(vals).forEach(k=>r.style.setProperty(k,vals[k]));
    if(dark){
      const rgba=(h,a)=>{const c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'};
      const sv={'--g1':rgba(ac,0.42),'--g2':rgba(ac,0.16),'--g3':rgba(mixc(ac,'#8844CC',0.55),0.28),'--glass':'rgba(255,255,255,.07)','--glassline':'rgba(255,255,255,.12)','--bf':'blur(14px)','--navbg':'color-mix(in srgb,var(--surface) 75%,transparent)'};
      Object.keys(sv).forEach(k=>r.style.setProperty(k,sv[k]));
    }
  }
  {let bgc=getComputedStyle(r).getPropertyValue('--bg').trim();let rc='#8A4FBF';if(/^#[0-9a-f]{6}$/i.test(bgc)){if(lum(bgc)<0.25)rc='#B58CE0';}r.style.setProperty('--ribbon',rc)}
  const m=document.querySelector('meta[name=theme-color]');
  if(m){const c=getComputedStyle(r).getPropertyValue('--accent').trim();if(c)m.setAttribute('content',c)}
}

/* Fusion : si une réinitialisation ou une restauration a eu lieu d'un côté (ep plus récent), ce côté gagne ; sinon les repas et aliments perso sont fusionnés par identifiant (la suppression l'emporte), et le reste (corrections, sensibilités, profil, statuts) vient du côté modifié en dernier. */
function mergeSnap(L,R){
  if((R.ep||0)>(L.ep||0))return cleanJournalSnapshot(R);
  if((L.ep||0)>(R.ep||0))return cleanJournalSnapshot(L);
  const del=Object.assign({},R.del||{});Object.keys(L.del||{}).forEach(k=>{del[k]=Math.max(del[k]||0,L.del[k])});
  const em={};
  [R.entries||[],L.entries||[]].forEach(arr=>arr.forEach(e=>{const k=String(e.id);if(del[k])return;const o=em[k];if(!o||(e.edited||e.ts||0)>=(o.edited||o.ts||0))em[k]=e}));
  const entries=cleanJournalEntries(Object.keys(em).map(k=>em[k]).sort((a,b)=>(a.ts||0)-(b.ts||0)));
  const newer=(L.mt||0)>=(R.mt||0)?L:R,older=newer===L?R:L;
  const cm={};
  [older.custom||[],newer.custom||[]].forEach(arr=>arr.forEach(f=>{if(!del[f.id])cm[f.id]=f}));
  const clean=o=>{const r=Object.assign({},o||{});Object.keys(r).forEach(k=>{if(del[k])delete r[k]});return r};
  return{app:'mici-score',fmt:1,ep:L.ep||0,mt:Math.max(L.mt||0,R.mt||0),custom:Object.keys(cm).map(k=>cm[k]),entries,over:clean(newer.over),sens:newer.sens||{},prof:newer.prof==='general'?'general':'poche',mods:newer.mods||{},flags:clean(newer.flags),del};
}
let _gisP=null;
function loadGIS(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  if(_gisP)return _gisP;
  _gisP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
    s.onload=()=>res();s.onerror=()=>{_gisP=null;rej(new Error('gis'))};document.head.appendChild(s);
    setTimeout(()=>{if(!(window.google&&google.accounts&&google.accounts.oauth2)){_gisP=null;rej(new Error('gis'))}},15000);
  });
  return _gisP;
}
/* Appli installée (écran d'accueil) : la fenêtre popup de Google reste blanche (v25), donc une redirection plein écran est utilisée.
   Limite connue : ce chemin utilise le flux implicite historique (response_type=token), que Google déconseille désormais pour les SPA.
   Le flux code + PKCE recommandé demande un endpoint backend et un échange de code côté serveur ; ne pas exposer de secret client dans ce fichier statique.
   Nécessite l'URI de redirection https://johunn.github.io/mici-score/ dans la console Google (voir GUIDE-GOOGLE-CLOUD.md). */
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true}catch(e){return false}};
const redirUri=()=>location.origin+location.pathname.replace(/[^\/]*$/,'');
function createOAuthState(){
  if(!window.crypto||typeof window.crypto.getRandomValues!=='function')throw new Error('secure-random');
  const bytes=new Uint8Array(32);
  window.crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
}
function acceptTokenResponse(r){
  const token=r&&typeof r.access_token==='string'?r.access_token:'';
  const tokenType=r&&typeof r.token_type==='string'?r.token_type.toLowerCase():'';
  const lifetime=Number(r&&r.expires_in);
  if(!token||token.length>8192||tokenType!=='bearer'||!Number.isFinite(lifetime)||lifetime<=0||lifetime>86400)throw new Error('oauth-response');
  gs.tok=token;
  gs.exp=Date.now()+lifetime*1000;
  return token;
}
function startRedirect(){
  const st=createOAuthState();
  try{localStorage.setItem('mici:gstate',st)}catch(e){throw new Error('state-storage')}
  const p=new URLSearchParams({client_id:cid(),redirect_uri:redirUri(),response_type:'token',scope:G_SCOPE,state:st,include_granted_scopes:'true'});
  if(store.acct&&store.acct.email)p.set('login_hint',store.acct.email);
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+p.toString());
}
function readRedirect(){
  if(!/[#&](access_token|error)=/.test(location.hash))return;
  const p=new URLSearchParams(location.hash.slice(1));
  let ok=false;
  try{const s=localStorage.getItem('mici:gstate');ok=!!s&&p.get('state')===s;localStorage.removeItem('mici:gstate')}catch(e){}
  /* Retire le jeton éventuel de l'URL avant tout autre rendu de l'application. */
  try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}
  if(!ok){gs.st='Connexion Google invalide ou interrompue : réessaie.';return}
  if(p.get('error')){gs.st=p.get('error')==='access_denied'?'Connexion Google refusée.':'Connexion Google impossible ('+p.get('error')+').';return}
  try{acceptTokenResponse({access_token:p.get('access_token'),token_type:p.get('token_type'),expires_in:p.get('expires_in')})}
  catch(e){gs.st='Réponse OAuth invalide ou expirée. Réessaie la connexion.'}
}
function getToken(interactive){
  const requestSession=gs.session;
  return new Promise((res,rej)=>{
    if(requestSession!==gs.session)return rej(new Error('cancelled'));
    if(gs.tok&&Date.now()<gs.exp-60000)return res(gs.tok);
    if(isStandalone()){
      if(!interactive)return rej(new Error('popup'));
      setTimeout(()=>rej(new Error('timeout')),90000);
      startRedirect();return;
    }
    if(interactive)setTimeout(()=>rej(new Error('timeout')),180000);
    loadGIS().then(()=>{
      if(requestSession!==gs.session)return rej(new Error('cancelled'));
      if(!gs.client)gs.client=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:G_SCOPE,callback:()=>{}});
      gs.client.callback=r=>{
        if(requestSession!==gs.session)return rej(new Error('cancelled'));
        if(r&&r.error)return rej(new Error(r.error));
        try{res(acceptTokenResponse(r))}catch(e){rej(e)}
      };
      gs.client.error_callback=e=>rej(new Error((e&&e.type)||'popup'));
      const o={prompt:interactive?'':'none'};
      if(store.acct&&store.acct.email)o.hint=store.acct.email;
      gs.client.requestAccessToken(o);
    }).catch(rej);
  });
}
async function gapi(tok,path,opt){
  const o=Object.assign({cache:'no-store'},opt||{});
  o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});
  const r=await fetch('https://www.googleapis.com'+path,o);
  if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
  return r;
}
async function verifyGoogleAccount(tok){
  const u=await (await gapi(tok,'/oauth2/v3/userinfo')).json();
  const email=typeof u.email==='string'?u.email.trim():'';
  if(!email||u.email_verified===false)throw new Error('account-email');
  const expected=store.acct&&typeof store.acct.email==='string'?store.acct.email.trim().toLowerCase():'';
  if(expected&&email.toLowerCase()!==expected)throw new Error('account-mismatch');
  return email;
}

}
async function putFile(tok,id,obj){

function errText(e){
  if(e&&e.status===401){gs.tok=null;return 'Reconnexion nécessaire : touche « Synchroniser maintenant ».'}
  if(e&&e.status===403)return 'Accès refusé par Google (autorisation Drive ou API Drive non activée).';
  if(e&&e.status===429)return 'Trop de requêtes : réessaie dans quelques minutes.';
  if(e&&e.message==='account-mismatch')return 'Le compte Google autorisé ne correspond pas au compte mémorisé. Déconnecte-toi puis reconnecte-toi avec le bon compte. Aucune donnée n’a été synchronisée.';
  if(e&&e.message==='account-email')return 'Impossible de vérifier l’identité du compte Google. Aucune donnée n’a été synchronisée ; réessaie.';
  if(e&&e.message==='oauth-response')return 'Google a renvoyé une réponse d’autorisation invalide. Réessaie la connexion.';
  if(e&&e.message==='secure-random')return 'Ce navigateur ne permet pas de générer un état de connexion sécurisé. Mets ton navigateur à jour.';
  if(e&&e.message==='state-storage')return 'Le navigateur ne permet pas de vérifier la connexion en toute sécurité. Autorise le stockage du site puis réessaie.';
  if(e&&e.message==='timeout')return 'La fenêtre Google n’a pas répondu. Si tu utilises l’icône installée, ouvre l’appli dans le navigateur (onglet normal) pour te connecter.';
  if(e&&e.message==='gis')return 'Connexion Google indisponible sur cette adresse ou hors ligne.';
  if(e&&(e.message==='popup_closed'||e.message==='popup_failed_to_open'||e.message==='access_denied'||e.message==='interaction_required'||e.message==='user_logged_out'||e.message==='immediate_failed'||e.message==='popup'))return 'Reconnexion nécessaire : touche « Synchroniser maintenant ».';
  if(e&&e.message==='bad')return 'Fichier en ligne illisible : rien n\u2019a été écrasé.';
  return 'Synchronisation impossible (hors ligne ou service injoignable). Tes données restent sur cet appareil.';
}
async function syncNow(interactive){
  if(!cid()||(!interactive&&!store.acct&&!gs.tok))return;
  if(!navigator.onLine&&!interactive){setSt('Hors ligne : synchronisation en attente.');return}
  if(gs.busy){gs.again=true;return}
  gs.busy=true;setSt('Synchronisation…');
  const session=gs.session;
  try{
    const tok=await getToken(!!interactive);
    if(session!==gs.session)return;
    /* Vérifier le compte avant de lire, fusionner ou écrire la sauvegarde Drive. */
    const email=await verifyGoogleAccount(tok);
    if(session!==gs.session)return;
    let id=await findFile(tok),R=null;
    if(session!==gs.session)return;
    if(id){
      const raw=await (await gapi(tok,'/drive/v3/files/'+id+'?alt=media')).text();
      if(session!==gs.session)return;
      try{R=JSON.parse(raw)}catch(e){R=null}
      if(!R||R.app!=='mici-score'||!Array.isArray(R.entries))throw new Error('bad');
    }
    if(session!==gs.session)return;
    const L=snap(),M=R?mergeSnap(L,R):L;
    if(R&&!store.onb&&((R.entries||[]).length||(R.custom||[]).length||Object.keys(R.over||{}).length)){store.onb=true;hideOnb()}
    else if(!R&&freshStore())setTimeout(maybeOnb,0);
    if(R&&sig(M)!==sig(L)){
      if(session!==gs.session)return;
      try{localStorage.setItem(KEY+':avant-synchro',JSON.stringify(store))}catch(e){}
      _applying=true;
      store.ep=M.ep;store.mt=M.mt;store.custom=M.custom;store.entries=M.entries;store.over=M.over;store.sens=M.sens;store.prof=M.prof;store.mods=M.mods;store.flags=M.flags;store.del=M.del;
      savePlate();save();_applying=false;
    }
    if(session!==gs.session)return;
    if(!R||sig(M)!==sig(R)){
      await putFile(tok,id,M);
      if(session!==gs.session)return;
    }
    if(session!==gs.session)return;
    gs.last=Date.now();store.acct={email:email||'',last:gs.last};save();
    gs.st='';
    if(R&&sig(M)!==sig(L)){ui.msg='Données synchronisées depuis ton Drive.'}
  }catch(e){if(session===gs.session)gs.st=errText(e)}
  finally{
    gs.busy=false;refreshGbar();
    if(ui&&ui.tab==='profil'||ui&&ui.msg)render(true);
    if(gs.again){gs.again=false;if(store.acct&&cid())setTimeout(()=>syncNow(false),500)}
  }
}

}
async function gDeleteOnline(){
  if(gs.busy){gs.st='Une opération Google est déjà en cours. Attends qu’elle se termine.';render(true);return}
  if(gs.timer){clearTimeout(gs.timer);gs.timer=null}
  gs.again=false;
  gs.busy=true;setSt('Suppression en ligne…');
  const session=gs.session;
  try{
    const tok=await getToken(true);
    if(session!==gs.session)return;
    /* Ne jamais supprimer un fichier Drive avant d'avoir vérifié le compte autorisé. */
    await verifyGoogleAccount(tok);
    if(session!==gs.session)return;
    let id,n=0;
    while((id=await findFile(tok))&&n<5){
      if(session!==gs.session)return;
      await gapi(tok,'/drive/v3/files/'+id,{method:'DELETE'});
      if(session!==gs.session)return;
      n++;
    }
    if(session!==gs.session)return;
    gs.st='';ui.msg=n?'Données en ligne supprimées. Une prochaine synchronisation les recréera : déconnecte-toi pour l\u2019éviter.':'Aucune donnée en ligne trouvée.';
  }catch(e){if(session===gs.session)gs.st=errText(e)}
  finally{gs.busy=false;gs.again=false;refreshGbar();render(true)}
}

/* Statuts d'aliments. « À surveiller » est calculé depuis le journal en comparant les bons et les mauvais repas ; il ne change pas le score. « Confirmé » et « écarté » sont des choix de l'utilisateur. */
const SUSP_MAX=4;
function foodStats(){
  const es=store.entries.filter(e=>Array.isArray(e.items)&&typeof e.r==='number'&&e.items.some(i=>i.id!=='legacy'));
  const per={};
  es.forEach(e=>{const seen={};e.items.forEach(it=>{if(it.id==='legacy'||seen[it.id])return;seen[it.id]=1;const o=per[it.id]=per[it.id]||{id:it.id,name:it.n,ms:[]};o.ms.push(e)})});
  const tot=es.length,sumAll=es.reduce((a,e)=>a+e.r,0);
  return Object.values(per).map(o=>{
    const n=o.ms.length,sw=o.ms.reduce((a,e)=>a+e.r,0),bad=o.ms.filter(e=>e.r<=4).length,good=o.ms.filter(e=>e.r>=7).length;
    const nWo=tot-n,meanWo=nWo>0?(sumAll-sw)/nWo:null;
    const rec=o.ms.slice().sort((a,b)=>b.ts-a.ts).slice(0,3),cleared=n>=4&&rec.length===3&&rec.every(e=>e.r>=7);
    return{id:o.id,name:o.name,n,bad,good,mean:sw/n,meanWo,nWo,cleared,gap:meanWo==null?null:meanWo-sw/n};
  });
}
function suspectList(){
  const fl=store.flags||{};
  return foodStats().filter(s=>!fl[s.id]&&!s.cleared&&s.bad>=2&&s.gap!=null&&s.gap>=1.5&&s.nWo>=3&&s.good<=s.bad*0.5).sort((a,b)=>b.gap-a.gap);
}
const suspectIds=()=>suspectList().slice(0,SUSP_MAX).map(s=>s.id);

const PLATE_KEY='mici:plate:v1';
function normalizePlate(items){
  if(!Array.isArray(items))return [];
  const seen=new Set();
  return items.slice(0,100).filter(p=>{
    if(!p||typeof p!=='object'||Array.isArray(p)||typeof p.id!=='string'||!byId(p.id)||seen.has(p.id))return false;
    if(!Number.isInteger(p.p)||![0,1,2,3].includes(p.p))return false;
    if(p.g!==undefined&&(!Number.isInteger(p.g)||p.g<0||p.g>1500))return false;
    seen.add(p.id);
    return true;
  }).map(p=>({id:p.id,p:p.p,g:p.g||0}));
}
function loadPlate(){
  try{
    if(Array.isArray(store.plate))return normalizePlate(store.plate);

  }catch(e){return []}
}

const portionFactors=[0.3,0.6,1,1.5],portionStops=[0,33,67,100],portionNames=['Trace','Petite','Normale','Grosse'];
function portionFactorAt(v){const x=Math.max(0,Math.min(100,+v||0));for(let i=0;i<3;i++){if(x<=portionStops[i+1]){const t=(x-portionStops[i])/(portionStops[i+1]-portionStops[i]);return portionFactors[i]+t*(portionFactors[i+1]-portionFactors[i])}}return portionFactors[3]}
function portionSliderValue(f,p,g){if(g>0){const factor=Math.max(.3,Math.min(1.5,g/refG(f)));for(let i=0;i<3;i++){if(factor<=portionFactors[i+1])return Math.round(portionStops[i]+(factor-portionFactors[i])/(portionFactors[i+1]-portionFactors[i])*(portionStops[i+1]-portionStops[i]))}return 100}return portionStops[[3,0,1,2].indexOf(p)]??67}
function portionGrams(f,v){return Math.max(1,Math.min(1500,Math.round(refG(f)*portionFactorAt(v))))}
function portionNameAt(v){const x=Math.max(0,Math.min(100,+v||0));return portionNames[x<16.5?0:x<50?1:x<83.5?2:3]}
function portionDisplay(f,p,g){const v=portionSliderValue(f,p,g);return portionNameAt(v)+' · ≈ '+(g>0?g:grOf(f,p))+' g'}

function dial(v){

  return `<svg class="dial ${cls(v)}" viewBox="0 0 200 118" role="img" aria-label="MICI Score ${fmt(v)} sur 10">
    <path class="track" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round"/>
    <path class="arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-dasharray="${d} ${len+2}"/>
    <text class="num" x="100" y="96" text-anchor="middle">${fmt(v)}</text>
    <text class="max" x="100" y="116" text-anchor="middle">sur 10</text></svg>`;
}

function listHTML(){

    all.sort(so==='nom'?(x,y)=>COL.compare(x.n,y.n):so==='scd'?(x,y)=>(sc[y.id]-sc[x.id])||COL.compare(x.n,y.n):(x,y)=>(sc[x.id]-sc[y.id])||COL.compare(x.n,y.n));

  };
  if(so!=='cat'){

    return pager+`<section class="group"><h3>${lab} (${foods.length})</h3><div class="rows">${foods.map(row).join('')}</div></section>`+pager;

  }).join('')+pager;
}

function recipeResultsHTML(){
  const allRecipes=window.MICI_RECIPES||[];
  const norm=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const resolve=ing=>allFoods().find(f=>ing.names.some(n=>norm(f.n)===norm(n)))||allFoods().find(f=>ing.names.some(n=>norm(f.n).startsWith(norm(n)+' ')));
  const q=norm(ui.recipeSearch),category=ui.recipeCategory||'Toutes';
  const recipes=allRecipes.filter(r=>(category==='Toutes'||r.category===category)&&(!q||norm([r.title,r.summary,r.category,...r.ingredients.flatMap(i=>i.names)].join(' ')).includes(q)));
  recipes.sort((a,b)=>ui.recipeSort==='category'?(COL.compare(a.category,b.category)||COL.compare(a.title,b.title)):ui.recipeSort==='score'?(recipeScore(b,resolve)-recipeScore(a,resolve))||COL.compare(a.title,b.title):COL.compare(a.title,b.title));
  const detail=recipes.find(r=>r.id===ui.recipeId);
  const card=r=>{
    const matches=r.ingredients.map(i=>({ingredient:i,food:resolve(i)}));
    const missing=matches.filter(x=>!x.food);
    const scoreItems=matches.filter(x=>x.food).map(x=>({f:x.food,p:1,g:x.ingredient.grams}));
    const score=scoreItems.length?scoreOf(scoreItems,ui).score:null;
    const selected=ui.recipeId===r.id;
    return `<article class="card" style="margin-top:12px"><div class="exp-eyebrow">${esc(r.category)}</div><h2 style="margin:5px 0 8px;font-size:20px">${esc(r.title)}</h2><p>${esc(r.summary)}</p><p class="small muted">Source : <a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${esc(r.sourceLabel)} ↗</a></p><p class="small muted">${r.servings} portion · ${matches.length-missing.length}/${matches.length} ingrédients reconnus${missing.length?' · score incomplet':''}</p>${score===null?'':`<div class="exp-row"><span class="exp-score ${cls(score)}">${fmt(score)}/10</span><span class="small muted">${missing.length?'Estimation partielle — ingrédients manquants':'Estimation selon les quantités indiquées'}</span></div>`}${selected?`<ul>${matches.map(x=>`<li>${esc(x.ingredient.names[0])} — ${x.ingredient.grams} g ${x.food?'':'<b>(non reconnu dans le catalogue)</b>'}</li>`).join('')}</ul><h3>Préparation</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><a href="${esc(r.source)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${esc(r.sourceLabel)} ↗</a></p>${missing.length?`<p class="notice">Le score est incomplet. Ajoute d’abord les aliments manquants au catalogue, puis reviens à cette recette. Aucun score complet n’est affiché.</p>`:`<button class="btn block" data-act="addRecipe" data-id="${esc(r.id)}">Ajouter les ingrédients à mon assiette</button>`}<button class="btn ghost block" data-act="closeRecipe">Fermer le détail</button>`:`<button class="btn ghost block" data-act="showRecipe" data-id="${esc(r.id)}">Voir la recette et son estimation</button>`}</article>`;
  };
  return recipes.length?recipes.map(card).join(''):'<div class="exp-empty">Aucune recette ne correspond à ta recherche. Essaie un autre ingrédient ou une autre catégorie.</div>';
}
function recipeScore(r,resolve){
  const items=r.ingredients.map(i=>({ingredient:i,food:resolve(i)})).filter(x=>x.food).map(x=>({f:x.food,p:1,g:x.ingredient.grams}));
  return items.length===r.ingredients.length?scoreOf(items,ui).score:-1;
}

function learning(){
  const es=store.entries.filter(e=>Array.isArray(e.L));
  const out=[];
  if(es.length<8)return{out,n:es.length};
  FEATS.forEach((f,i)=>{
    const hi=es.filter(e=>e.L[i]>=1.5),lo=es.filter(e=>e.L[i]<1.5);
    if(hi.length<3||lo.length<3)return;
    const m=a=>a.reduce((s,e)=>s+e.r,0)/a.length;
    const diff=m(lo)-m(hi),s=sensOf(f.k);
    if(diff>=2&&s<2)out.push({k:f.k,n:f.n,dir:1,txt:`Tes notes sont en moyenne ${fmt(diff)} points plus basses quand « ${f.n.toLowerCase()} » est élevé (${hi.length} repas contre ${lo.length}).`,to:Math.min(2,Math.round((s+0.25)*100)/100)});
    else if(diff<=0&&s>0.75&&hi.length>=5&&lo.length>=5)out.push({k:f.k,n:f.n,dir:-1,txt:`Aucun écart visible dans tes notes selon « ${f.n.toLowerCase()} » (${hi.length} repas contre ${lo.length}).`,to:Math.max(0.5,Math.round((s-0.25)*100)/100)});
  });
  return{out,n:es.length};
}

    <p class="small muted" style="margin:10px 0 0"><b>Sur un nouvel appareil</b> : ouvre l\u2019appli, touche « Se connecter » avec le même compte Google, tes données se rechargent. Thème, mise en page et tri restent propres à chaque appareil.</p>
    <p class="small muted" style="margin:10px 0 0"><b>Tu gardes la main</b> : « Se déconnecter » arrête la synchronisation ; « Supprimer mes données en ligne » efface la copie du Drive ; tu peux aussi retirer l\u2019accès à l\u2019appli dans les paramètres de sécurité de ton compte Google. Ce sont des données de santé : l\u2019appli reste entièrement utilisable sans compte. <a href="confidentialite.html" target="_blank" rel="noopener">Politique de confidentialité</a>.</p>
  </div>
  <div class="card"><h3>Sauvegarde</h3>
    <p class="muted small">Tes données sont stockées uniquement dans ce navigateur. Vider les données de Chrome les efface. Copie une sauvegarde de temps en temps et garde-la dans une note.</p>
    <p><button class="btn block" data-act="export">Copier la sauvegarde</button></p>
    ${ui.exportText ? `<div class="field"><label for="backupOut">Sauvegarde à copier manuellement</label><textarea id="backupOut" rows="8" readonly>${esc(ui.exportText)}</textarea><button class="btn ghost block" style="margin-top:8px" data-act="selectBackup">Sélectionner le texte de la sauvegarde</button><p class="small muted">Le texte est sélectionné ; copie-le avec Ctrl+C (ou la commande Copier de ton appareil).</p></div>` : ``}
    <div class="field"><label for="imp">Restaurer depuis une sauvegarde</label><textarea id="imp" placeholder="Colle ici le texte copié"></textarea></div>
    <p style="margin:10px 0 0"><button class="btn ghost block" data-act="import">Restaurer</button></p>
    <p id="profileStatus" class="small" role="status" style="margin:10px 0 0;display:${ui.msg?'block':'none'}">${esc(ui.msg)}</p>
  </div>
  <div class="card"><h3>Effacer</h3>
    <p class="muted small">Supprime notes, corrections, sensibilités et aliments ajoutés.</p>
    <button class="btn danger block" data-act="reset">${ui.resetArmed?'Confirmer : tout effacer':'Tout effacer'}</button>
  </div>
  <div class="card"><h3>Quand consulter</h3>
    <p class="small muted">Contacte ton gastro-entérologue ou un diététicien MICI en cas de perte de poids, dénutrition, douleurs importantes, ballonnement avec arrêt des gaz et des selles (occlusion possible), sang dans les selles, fièvre, signes de déshydratation, fuites nocturnes ou plus de selles pendant plusieurs jours (pochite possible). Surveillance nutritionnelle : pas de fréquence universelle validée. B12 après poche iléo-anale, fréquence fixée par ton gastro ; fer en cas d'anémie, fatigue, saignement ou restriction alimentaire ; vitamine D surtout en cas de carence, os fragiles ou malabsorption. Hydratation : individualisée, surtout si selles fréquentes ou liquides ; demande au pharmacien une solution de réhydratation si besoin. Le score n'est ni un diagnostic ni un traitement.</p>
  </div>
  <p class="small muted" style="text-align:center;margin:18px 0 0">MICI Score ${APP_V} · ${FOODS.length} aliments</p>`;

function updateBar(){
  const n=ui.plate.length;
  if(ui.tab!=='compose'||!n||ui.view==='plate'||ui.view==='add'||ui.view==='detail'){bar.innerHTML='';return}
  const r=scoreOf(plateItems(),ui);
  bar.innerHTML=`<div class="wrap"><button class="main" data-act="openPlate"><span class="badge ${cls(r.score)}">${fmt(r.score)}</span><span class="grow">Repas en cours · ${n} aliment${n>1?'s':''}</span><span>Voir ›</span></button><button class="clr" data-act="clearBar" aria-label="Vider l\u2019assiette">Vider</button></div>`;
}

function sourcesHTML(){
  const A=(u,t)=>`<a href="${u}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${t}</a>`;
  return `<div class="card" style="margin-top:0"><h3>À lire en premier</h3>
    <p class="small">Le MICI Score est une estimation personnelle de la tolérance digestive, construite pour une rectocolite avec poche en J. Ce n'est ni un diagnostic, ni un traitement, ni un avis médical. Il n'a pas été validé cliniquement. Tes notes du journal priment toujours sur la grille.</p>
    <p class="small muted">Cet onglet explique d'où viennent les chiffres, pour qu'un médecin ou un diététicien puisse les vérifier et les corriger.</p></div>
  <div class="card"><h3>1. Comment le score est calculé</h3>
    <p class="small">Les niveaux des aliments simples vont généralement de 0 à 3 (par demi-point). Certaines valeurs de plats composés sont des estimations agrégées pouvant atteindre 4 ; le calcul plafonne chaque caractéristique à 4. Pénalité = somme(poids × ta sensibilité × multiplicateur du profil × niveau) + 0,3 × additifs − 0,5 × bonus épaississant (minimum 0). Score = 10 × exp(−pénalité / 9), donc entre 0 et 10 (10 = très bien toléré). La forme exponentielle évite que tous les plats gras tombent à 0 ; elle et le diviseur 9 sont arbitraires.</p>
    <p class="small muted">Poids en grammes : le facteur est poids saisi / poids de référence de la portion normale, plafonné entre ×0,1 et ×3. Références tirées de la table belge NUBEL « Poids et mesures » (Conseil supérieur de la Santé ; seules les valeurs filet de poulet 160 g et croque-monsieur 135 g ont été revérifiées, les autres restent à vérifier) pour œuf 50 g, jambon cuit 45 g, fromage fondu 20 g, fromage en tranche 25 g, filet de poulet 160 g, saumon 180 g, darne de cabillaud 175 g, riz cuit 150 g, frites 250 g, lasagnes 400 g, croque-monsieur 135 g, croissant 50 g, pomme 140 g, banane 130 g, mayonnaise et ketchup en cuillère 25 g ; le pain (80 g, trois tranches) et la demi-baguette (130 g) en sont déduits ; les autres références (légumes 150 g, viandes 120 g, boissons 200 g, etc.) sont des estimations sans source. Portion : trace ×0,3 (sauces et condiments, par défaut dans l'assiette), petite ×0,6, normale ×1, grosse ×1,5. À jeun : lactose ×1,3. Les niveaux d'une assiette s'additionnent (plafonnés à 4) : un sandwich de 6 ingrédients compte donc 6 portions, d'où des scores très bas si les portions ne sont pas réduites. Les poids affichés sous Trace, Petite, Normale et Grosse dans l'assiette sont la référence de la portion normale multipliée par le coefficient (arrondis à 5 g) : ce sont des estimations. Ces ajustements sont arbitraires.</p>
    <p class="small muted">Lecture : 6 ou plus généralement bien toléré ; 4 à 6 à adapter ; moins de 4 plusieurs points d'attention. Seuils abaissés parce que l'ancienne échelle (7 et 5, gras à 2,0, diviseur 6,5) classait 90 % des plats en rouge : elle était calibrée sur de mauvais repas seulement. Ces seuils ne sont pas validés. Le score affiché combine l'estimation et ta moyenne personnelle quand tu as des notes.</p></div>
  <div class="card"><h3>2. Caractéristiques, poids et niveau de preuve</h3>
    ${FEATS.map(f=>`<div style="margin:0 0 10px"><b class="small">${f.n} · poids ${fmt(f.w)}</b><span class="small muted" style="display:block">${f.d}</span><span class="small" style="display:block">Preuve : ${f.ev}</span><span class="small muted" style="display:block">${f.sr}</span></div>`).join('')}
    <div style="margin:0 0 10px"><b class="small">Additifs / ultra-transformés · poids 0,3</b><span class="small" style="display:block">Preuve : faible, estimation arbitraire</span><span class="small muted" style="display:block">ECCO 2025 : les ultra-transformés sont associés au développement de la maladie de Crohn, pas de la RCH. Crohn's &amp; Colitis UK : les données sur les additifs viennent d'études animales. Aucune donnée spécifique à la poche.</span></div>
    <div><b class="small">Bonus épaississant · −0,5 par niveau</b><span class="small" style="display:block">Preuve : opinion d'expert</span><span class="small muted" style="display:block">Riz blanc, banane, pomme de terre, féculents : cités comme épaississant les selles dans des fiches de diététique de poche (Hull NHS).</span></div></div>
  <div class="card"><h3>3. Profils</h3>
    <p class="small"><b>Poche en J</b> (défaut) : oligosaccharides à poids 0,3, fibres insolubles ×0,8. <b>Général</b> : barème sans ajustement (oligosaccharides à 1). <b>Sténose</b> (option) : fibres insolubles ×1,5. <b>Crohn</b> (option) : aucun effet sur le score.</p>
    <p class="small muted">Ces multiplicateurs sont des hypothèses de départ arbitraires. Aucune source ne donne de valeur chiffrée pour une poche. Les aliments déjà calibrés sur tes retours gardent leur poids d'origine.</p></div>
  <div class="card"><h3>4. Origine des niveaux par aliment</h3>
    <p class="small">Les ${FOODS.length} aliments viennent de connaissances générales (gras, lactose, fibres, FODMAP approximatifs). Aucun niveau n'est validé par une source par aliment. Le partage des fermentescibles entre oligosaccharides et fructose/polyols a été fait par règles de mots-clés (fructanes de l'oignon, de l'ail et du blé ; GOS des légumineuses ; polyols et fructose en excès des fruits, champignons et édulcorants). 65 % des aliments concernés ne correspondent à aucune règle et sont coupés 50/50 par défaut. La règle appliquée est visible dans la fiche de chaque aliment. Les additifs sont attribués par mots-clés (snacks, sodas light, biscuits, surgelés).</p>
    <p class="small muted">Les produits de marque n'ont pas leur composition exacte. Le score d'une assiette suppose des effets additifs ; l'ordre des aliments, la quantité exacte, le repas de la veille, le stress et la fatigue ne sont pas modélisés.</p></div>
  <div class="card"><h3>5. Personnalisation</h3>
    <p class="small">Tu peux corriger le score d'un aliment (il remplace le calcul), régler une sensibilité par caractéristique (×0,5 à ×2) et noter chaque repas de 0 à 10 dans le journal. Les suggestions d'apprentissage demandent au moins 8 repas avec détail et 3 par groupe. Ce sont des corrélations, pas des preuves : plusieurs aliments se mélangent dans un repas.</p>
    <p class="small"><b>Déclencheur personnel</b> : un aliment avec au moins 2 notes seul et une moyenne de 4 ou moins est signalé, même si la grille le classe favorable. En cas de désaccord entre la grille et ton journal, le journal prime.</p></div>
  <div class="card"><h3>Statuts d'aliments : à surveiller, confirmé, écarté</h3>
    <p class="small">Un aliment est « à surveiller » s'il figure dans au moins 2 repas notés 4 ou moins, si la moyenne des repas qui le contiennent est au moins 1,5 point sous celle des repas sans lui (au moins 3 repas sans lui), et si les repas notés 7 ou plus qui le contiennent ne dépassent pas la moitié des mauvais. Les bons repas comptent donc autant que les mauvais. Ces seuils sont arbitraires. Au plus 4 suspects sont affichés à la fois, pour éviter une restriction en cascade.</p>
    <p class="small muted">« À surveiller » ne change pas le score. « Confirmé » est ta décision : l'appli applique alors ta moyenne comme correction du score (modifiable). « Écarté » sort l'aliment de la liste. Le journal ne contrôle ni le repas de la veille, ni le gras, le stress, la fatigue ou le délai entre le repas et les symptômes : c'est une corrélation, pas une preuve. Le seul vrai test est de retirer l'aliment quelques jours, un changement à la fois. Avec une poche, une restriction excessive expose à la perte de poids et aux carences : un diététicien MICI aide à la limiter. Le « déclencheur personnel » (2 notes seul, moyenne de 4 ou moins) reste un simple message dans la fiche, sans effet sur le score.</p></div>
  <div class="card"><h3>6. Sources</h3>
    <ul class="small muted" style="padding-left:18px;margin:0">
      <li>ECCO, Dietary Management of IBD (consensus 2025). ${A('https://ecco-ibd.eu/publications/news/issues/2025/volume-20-issue-4/dietary-management-of-inflammatory-bowel-disease-an-ecco-consensus','Synthèse ECCO News')} (texte complet non relu : PDF inaccessible). Alimentation saine de base ; low FODMAP recommandé pour symptômes de type SII en rémission ; preuves insuffisantes sur les fibres hors sténose ; pas de régime pour induire la rémission en RCH ; régime méditerranéen possible en maintenance de RCH ; accès à un diététicien MICI.</li>
      <li>AGA, Clinical Practice Update diet and nutritional therapies in IBD. ${A('https://gastro.org/clinical-guidance/diet-and-nutritional-therapies-in-patients-with-ibd/','gastro.org')} Régime méditerranéen conseillé ; aucun régime n'a prouvé qu'il réduit les poussées ; surveillance vitamine D, fer et B12 (résection iléale ou poche).</li>
      <li>Crohn's &amp; Colitis UK, Food and Crohn's or Colitis (2025). ${A('https://www.crohnsandcolitis.org.uk/info-support/information-about-crohns-and-colitis/all-information-about-crohns-and-colitis/living-with-crohns-or-colitis/food','crohnsandcolitis.org.uk')} Guide patient.</li>
      <li>NHS : fiches University Hospitals Sussex et Milton Keynes (Crohn), Hull University Teaching Hospitals (poche iléo-anale). ${A('https://www.hey.nhs.uk/patient-leaflet/eating-with-an-ileoanal-pouch/','Hull')} Guides patients ; la fiche de Hull (mise à jour en juin 2026) associe oignon, ail, chou et légumineuses aux gaz, ballonnements et odeur, et conseille un régime pauvre en fibres pendant la phase d'adaptation après la chirurgie, puis une alimentation équilibrée.</li>
      <li>Ardalan et al., Aliment Pharmacol Ther 2020;52:1323-1340, revue narrative sur l'alimentation et la poche : les FODMAP des fruits et légumes pèsent le plus sur la fonction de la poche ; données faibles. ${A('https://pubmed.ncbi.nlm.nih.gov/32955120/','PubMed')}</li>
      <li>Ardalan et al., JGH Open 2023 : Monash Pouch Diet, essai ouvert de 12 patients, sans groupe témoin. ${A('https://doi.org/10.1002/jgh3.13008','DOI')} Et JGH Open 2025 : essai randomisé en double aveugle sur 6 patients avec un antécédent de pochite chronique, sans pochite active selon les auteurs, arrêté tôt (résultats détériorés dans les deux bras, symptômes aggravés chez tous les patients du bras Monash), effet sur la pochite non établi. ${A('https://pubmed.ncbi.nlm.nih.gov/41054558/','PubMed')}</li>
      <li>Gold et al., Inflamm Bowel Dis 2024, revue systématique sur les régimes et compléments avec une poche : essais hétérogènes aux résultats incohérents (résumé lu seulement). ${A('https://doi.org/10.1093/ibd/izae037','DOI')}</li>
      <li>Croagh et al. 2007, étude ouverte d'un régime pauvre en FODMAP avec poche, rapportée par la revue de Gold 2024 (source secondaire) : fréquence des selles améliorée chez 5 patients sur 7, médiane de 8 à 4 par jour chez les patients sans pochite, aucune amélioration chez les 8 patients avec pochite.</li>
    </ul></div>
  <div class="card"><h3>Fonction de la poche et pochite</h3>
    <p class="small muted">Deux sujets distincts. Fonction de la poche : fréquence, consistance, urgence, ballonnement ; ECCO 2025, déclaration 25.1 (EL4, consensus 100 %) : les fibres fermentescibles pourraient améliorer la fonction de la poche, avec une preuve insuffisante pour les fibres non fermentescibles. Ce n'est pas une recommandation de régime pauvre en FODMAP : le texte cite des données contradictoires et de faible niveau (suppléments d'inuline et un régime augmentant les oligosaccharides d'un côté, une petite étude ouverte de régime pauvre en FODMAP de l'autre). Ces données vont plutôt dans le sens d’un bénéfice possible des fibres fermentescibles sur la fréquence des selles, à l’opposé du poids 0,3 appliqué ici aux oligosaccharides : ce poids repose sur des guides patients (gaz, ballonnements, odeur), pas sur la fréquence des selles ; l’étude transversale citée par ECCO (Ardalan 2023, Clin Nutr) n’est pas précisée dans le texte d’ECCO quant au sens de l’association entre oligosaccharides et pochite passée ; un extrait du texte intégral évoque une association positive, non confirmé ici, et une étude transversale ne montre pas de causalité. Pochite : le régime méditerranéen et le fruit quotidien sont possiblement associés à un moindre risque (ECCO 2025, déclaration 25.2, EL4, études d'observation ; données insuffisantes sur le traitement), alors que les fruits peuvent augmenter les selles, donc un seul score ne peut pas couvrir les deux. Les FODMAP ne sont ni une cause ni un traitement de la pochite, et l'appli n'attribue aucun score alimentaire causal à la pochite.</p>
    <p class="small muted">Monash Pouch Diet : essai ouvert 2023 sur 12 patients (1 retrait pour obstruction partielle, tolérance excellente chez 9) ; essai randomisé en double aveugle 2025 sur 6 patients avec un antécédent de pochite chronique (sans pochite active selon les auteurs), arrêté tôt (résultats détériorés dans les deux bras, tous les patients du bras Monash aggravés), effet sur la pochite non établi. Ce régime vise à augmenter les oligosaccharides (6 à 8 g par jour selon l'article de 2023) tout en réduisant les protéines totales et soufrées, le fructose en excès, les polyols et certains additifs : ce n'est pas l'inverse d'un régime pauvre en FODMAP, c'est une stratégie différente. Ces essais portent sur des poches symptomatiques avec pochite, pas sur une poche stable. Hypothèse à tester, jamais un traitement validé.</p></div>
  <div class="card"><h3>Non pris en compte dans l'appli</h3>
    <p class="small muted">Régimes d'exclusion et nutrition entérale (interventions thérapeutiques encadrées par un diététicien), compléments, probiotiques, curcumine et régime sans gluten. Ne pas les démarrer sans avis médical.</p></div>
  <div class="card"><h3>7. Ce qui n'est pas démontré</h3>
    <ul class="small muted" style="padding-left:18px;margin:0">
      <li>ECCO 2025, déclaration 23.1 (EL4, consensus 100 %) : données insuffisantes pour un régime pauvre en graisses dans la diarrhée par acides biliaires après résection de l’iléon terminal dans la maladie de Crohn (population différente de la poche).</li>
      <li>Le lien entre les apports en graisses, les acides biliaires et les selles avec une poche reste insuffisamment établi.</li>
      <li>L'effet des oligosaccharides, du fructose et des polyols sur la poche : preuve faible ou insuffisante.</li>
      <li>L'effet de la cuisson sur les fructanes, de l'alcool et de la bière sur les selles en poche, des ultra-transformés sur la poche : preuve insuffisante.</li>
      <li>Le Monash Pouch Diet est une hypothèse à tester, jamais un traitement validé.</li>
      <li><b>Ce score n'est pas un outil validé.</b> Une revue systématique de 2025 sur les indices de qualité alimentaire (référence rapportée par une source secondaire, non vérifiée par moi) conclut qu'aucun indice n'est validé pour les MICI, et il n'existe pas d'indice ni de « feu tricolore » publié et validé pour la RCH ou la poche. Ce qui s'en approche le plus évalue la qualité de l'alimentation, pas la tolérance d'un aliment.</li>
      <li><b>Effet de la quantité</b> : la dépendance à la portion est démontrée pour les FODMAP (seuils par portion, Varney et al., J Gastroenterol Hepatol 2017, établis surtout dans le syndrome de l'intestin irritable). Pas de courbe dose-réponse validée pour la poche, ni pour le gras ou les fibres. Les coefficients de portion de l'appli (trace 0,3, petite 0,6, grosse 1,5) sont arbitraires.</li>
      <li><b>Calibrage des seuils</b> : les seuils de couleur (vert dès 6, rouge sous 4) et le diviseur 9 sont des choix de lecture, pas des valeurs sourcées. Ils ont été abaissés parce que la première échelle classait 90 % des plats en rouge.</li>
      <li>Aucune fréquence de dosage de B12, fer, vitamine D ou vitamines liposolubles n'est affichée : il n'existe pas de fréquence universelle validée ; c'est le gastro-entérologue qui la fixe.</li>
      <li>ECCO 2025 (J Crohns Colitis 2025;19(9):jjaf122), PDF complet relu le 12 octobre 2026. Déclaration 25.1 : les fibres fermentescibles pourraient améliorer la fonction de la poche, preuve insuffisante pour les fibres non fermentescibles (EL4, consensus 100 %). Déclaration 25.2 : le régime méditerranéen et le fruit quotidien pourraient être associés à moins de pochite, données insuffisantes sur le traitement (EL4, consensus 100 %). Déclaration 21.1 : aucune donnée pour un régime pauvre en fibres dans la maladie de Crohn avec sténose ; un raisonnement mécanistique suggère de réduire les fibres de volume en cas de symptômes obstructifs (EL5, consensus 100 %). Déclaration 20.1 : low FODMAP recommandé pour des symptômes de type SII en rémission (EL1, consensus 100 %). Déclaration 12 : low FODMAP non recommandé en maintenance de la maladie de Crohn (EL2), aucune donnée en RCH. Le consensus de 100 % mesure l’accord des experts, pas la qualité des preuves.</li>
    </ul></div>
  <div class="card"><h3>Ruban violet</h3>
    <p class="small muted">Le ruban violet près du titre symbolise la sensibilisation aux MICI (la Journée mondiale des MICI a lieu le 19 mai ; source : afa Crohn RCH France). C'est un ruban générique, pas le logo d'une association, et l'appli n'est affiliée à aucune association.</p></div>
  <div class="card"><h3>8. Limites et sécurité</h3>
    <p class="small muted">Aucune étude ne valide ce score. L'application ne détecte ni pochite ni déshydratation. Consulte rapidement en cas de fièvre, déshydratation, sang important, douleurs importantes, ballonnement avec arrêt des gaz et des selles, augmentation brutale des selles, perte de poids ou fuites nocturnes. Un diététicien MICI est recommandé avant tout régime restrictif. Un régime pauvre en FODMAP, s'il était utilisé pour un SII, serait temporaire, en phases et suivi par un diététicien, jamais permanent.</p></div>
  <div class="card"><h3>Pour mon médecin</h3>
    <p class="small muted">Questions à discuter : mon nombre de selles par jour est-il normal pour ma poche, et quel seuil doit me faire consulter ? Quelle fréquence de suivi pour la B12, le fer et la vitamine D ? Le lopéramide est-il autorisé ? Quelle hydratation et quelle solution de réhydratation ? Un test de malabsorption des acides biliaires ou d'intolérance au lactose est-il utile ? Un diététicien MICI est-il accessible ? Alcool et bière ? Dépistage de la fragilité osseuse ?</p></div>`;
}
/* Navigation : le bouton Retour d'Android remonte d'un écran dans l'appli (liste, détail, assiette, onglets) au lieu de quitter la page. */
let fromPop=false,navDepth=0;
const navKey=()=>ui.tab+'|'+ui.view+'|'+(ui.view==='detail'?ui.sel:'');
let lastKey=navKey();
try{history.replaceState({tab:ui.tab,view:ui.view,sel:ui.sel},'')}catch(e){}
window.addEventListener('popstate',e=>{
  const s=e.state;navDepth=Math.max(0,navDepth-1);fromPop=true;
  if(s&&s.tab){ui.tab=s.tab;ui.view=s.view;ui.sel=s.sel}else{ui.tab='calc';ui.view='list';ui.sel=null}
  ui.msg='';lastKey=navKey();render();fromPop=false;
});
function render(keep){
  const k=navKey();
  if(k!==lastKey){lastKey=k;if(!fromPop){try{history.pushState({tab:ui.tab,view:ui.view,sel:ui.sel},'');navDepth++}catch(e){}}}
  const y=window.scrollY;
  document.querySelectorAll('nav.tabs button').forEach(b=>{const active=b.dataset.tab===ui.tab||(b.dataset.tab==='catalogue'&&ui.tab==='compose'&&ui.view==='list')||(b.dataset.tab==='recipes'&&ui.tab==='compose'&&ui.view==='recipes');if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  app.innerHTML=(ui.tab==='calc'||ui.tab==='compose')?calcHTML():ui.tab==='journal'?journalHTML():ui.tab==='sources'?sourcesHTML():profilHTML();
  updateBar();refreshGbar();
  window.scrollTo(0,keep?y:0);
}

/* ---------- Événements ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const target=b.dataset.tab;ui.msg='';ui.resetArmed=false;ui.delArmed=false;
  if(target==='recipes'){ui.tab='compose';ui.view='recipes';ui.recipeId=null;render();return}
  if(target==='catalogue'){ui.tab='compose';ui.view='list';ui.qs='';ui.cat=-1;ui.page=0}
  else {ui.tab=target;if(ui.tab==='calc')ui.view='home';else if(ui.tab==='compose')ui.view='plate';else if(ui.tab==='journal')ui.editId=null}
  render();
});

document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.gi!=null){const i=+t.dataset.gi;if(ui.plate[i]){const g=Math.max(0,Math.min(1500,Math.round(+t.value||0)));ui.plate[i].g=g; if(g>0)ui.plate[i].p=1;savePlate();render(true)}}else if(t.dataset&&t.dataset.pr!=null){const i=+t.dataset.pr;if(ui.plate[i]){const v=Math.max(0,Math.min(100,+t.value||0)),snap=portionStops.indexOf(v),levels=[3,0,1,2];if(snap>=0){ui.plate[i].p=levels[snap];ui.plate[i].g=0}else{ui.plate[i].p=1;ui.plate[i].g=portionGrams(byId(ui.plate[i].id),v)}savePlate();render(true)}}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qs'){ui.qs=t.value;ui.page=0;document.getElementById('list').innerHTML=listHTML();const cb=document.querySelector('.searchbox .clear');if(cb)cb.hidden=!t.value}
  else if(t.id==='recipe-search'){ui.recipeSearch=t.value;const results=document.getElementById('recipe-results');if(results)results.innerHTML=recipeResultsHTML()}
  else if(t.dataset&&t.dataset.pr!=null){const i=+t.dataset.pr;const item=ui.plate[i];const label=document.getElementById('portion-label-'+i);if(item&&label){const g=portionGrams(item.f,+t.value);label.textContent=portionDisplay(item.f,1,g);t.setAttribute('aria-valuetext',label.textContent)}}
  else if(t.id==='ress'){ui.ress=+t.value;document.getElementById('ressv').textContent=t.value}
  else if(t.id==='note'){ui.note=t.value}
  else if(t.id==='eress'){ui.eR=+t.value;const v=document.getElementById('eressv');if(v)v.textContent=t.value}
  else if(t.id==='enote'){ui.eNote=t.value}
  else if(t.id==='newName'){ui.newName=t.value}
  else if(t.id==='ov'){ui.ov=+t.value;document.getElementById('ovv').textContent=fmt(ui.ov)}
  else if(t.id==='cbg'){store.cbg=t.value;save();applyTheme()}
  else if(t.id==='cac'){store.cac=t.value;save();applyTheme()}
  else if(t.dataset&&t.dataset.k&&t.id.indexOf('s-')===0){
    store.sens[t.dataset.k]=+t.value;save();
    document.getElementById('sv-'+t.dataset.k).textContent='×'+fmt(+t.value);
  }
});

function refreshPrev(){
  const prev=clamp(rawScore(levels([{f:{L:ui.newL,b:ui.newB},p:1}])),0,10);
  const el=document.getElementById('prev');if(el){el.textContent=fmt(prev);el.className=cls(prev)}
}
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='jeun'){ui.jeun=t.checked;render(true)}
  else if(a==='aurora'){store.aurora=t.checked;save();applyTheme();render(true)}
  else if(a==='nl'){ui.newL[+t.dataset.i]=+t.value;refreshPrev()}
  else if(a==='nb'){ui.newB=+t.value;refreshPrev()}
  else if(t.id==='newCat'){ui.newCat=+t.value}
  else if(t.id==='sort-control'){ui.sort=t.value;store.sort=t.value;save();ui.page=0;render(true)}
  else if(t.id==='recipe-category'){ui.recipeCategory=t.value;const results=document.getElementById('recipe-results');if(results)results.innerHTML=recipeResultsHTML()}
  else if(t.id==='recipe-sort'){ui.recipeSort=t.value;const results=document.getElementById('recipe-results');if(results)results.innerHTML=recipeResultsHTML()}
});

function openDetail(id){ui.sel=id;ui.view='detail';ui.msg='';const f=byId(id);ui.ov=f?Math.round(foodScore(f)*2)/2:5;render()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.gmenu){ui.gmenu=false;refreshGbar()}});
document.addEventListener('click',e=>{
  if(ui.gmenu&&!e.target.closest('#gbar')){ui.gmenu=false;refreshGbar()}
  const b=e.target.closest('[data-act]');if(!b||(b.tagName==='INPUT'&&b.type!=='checkbox')||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='add'){
    const i=ui.plate.findIndex(x=>x.id===id),row=b.closest('.row');
    if(i>=0){ui.plate.splice(i,1);row.classList.remove('sel');b.setAttribute('aria-pressed','false')}
    else{ui.plate.push({id,p:defP(id)});row.classList.add('sel');b.setAttribute('aria-pressed','true')}
    savePlate();updateBar();
  }
  else if(a==='clearq'){ui.qs='';ui.page=0;const q=document.getElementById('qs');q.value='';document.getElementById('list').innerHTML=listHTML();b.hidden=true;q.focus()}
  else if(a==='info'){openDetail(id)}
  else if(a==='addDetail'){const i=ui.plate.findIndex(x=>x.id===id);if(i>=0){ui.plate.splice(i,1);ui.msg='Retiré de l\u2019assiette.'}else{ui.plate.push({id,p:defP(id)});ui.msg='Ajouté à l\u2019assiette.'}savePlate();render(true)}
  else if(a==='openPlate'){ui.tab='compose';ui.view='plate';render()}
  else if(a==='startCompose'){ui.tab='compose';ui.view='plate';ui.msg='';render()}
  else if(a==='openRecipes'){ui.tab='compose';ui.view='recipes';ui.recipeId=null;render()}
  else if(a==='showRecipe'){ui.recipeId=id;ui.view='recipes';render(true)}
  else if(a==='closeRecipe'){ui.recipeId=null;ui.view='recipes';render(true)}
  else if(a==='addRecipe'){
    const recipe=(window.MICI_RECIPES||[]).find(r=>r.id===id);
    if(recipe){const norm=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const next=recipe.ingredients.map(ing=>({ing,food:allFoods().find(f=>ing.names.some(n=>norm(f.n)===norm(n)))||allFoods().find(f=>ing.names.some(n=>norm(f.n).startsWith(norm(n)+' ')))}));if(next.every(x=>x.food)){ui.plate=next.map(x=>({id:x.food.id,p:1,g:x.ing.grams})).slice(0,100);savePlate();ui.view='plate';ui.tab='compose';ui.msg='Ingrédients ajoutés. Vérifie les quantités avant d’enregistrer le repas.';ui.recipeId=null;render()}else{ui.msg='Certains ingrédients ne sont pas reconnus : score complet indisponible.';render(true)}}
  }
  else if(a==='explore'){ui.tab='compose';ui.view='list';ui.qs='';ui.cat=-1;ui.page=0;render();const q=document.getElementById('qs');if(q)q.focus()}
  else if(a==='openJournal'){ui.tab='journal';ui.msg='';render()}
  else if(a==='openProfile'){ui.tab='profil';ui.msg='';render()}
  else if(a==='openSources'){ui.tab='sources';ui.msg='';render()}
  else if(a==='journalRange'){ui.journalDays=+b.dataset.days;render(true)}
  else if(a==='repeatEntry'){
    const e=store.entries.find(x=>String(x.id)===String(id));
    if(e){ui.mealEditId=e.id;ui.mealEditReturn=ui.tab==='journal'?'journal':'calc';ui.plate=(e.items||[]).map(x=>({id:x.id,p:Number.isFinite(+x.p)?Math.max(0,Math.min(3,+x.p)):1,g:Number.isFinite(+x.g)?Math.max(0,Math.min(1500,+x.g)):0})).filter(x=>byId(x.id)).slice(0,100);savePlate();ui.jeun=!!e.jeun;ui.ress=Number.isFinite(+e.r)?Math.max(0,Math.min(10,+e.r)):7;ui.note=e.note||'';ui.view='plate';ui.tab='compose';ui.msg='';render()}
  }
  else if(a==='clearBar'){ui.plate=[];savePlate();document.querySelectorAll('.row.sel').forEach(r=>{r.classList.remove('sel');const n=r.querySelector('.name');if(n)n.setAttribute('aria-pressed','false')});updateBar()}
  else if(a==='back'){if(ui.view==='list'){ui.view='plate';ui.tab='compose'}else{ui.view='list';ui.tab='compose'}ui.msg='';render()}
  else if(a==='cat'){ui.cat=+b.dataset.i;ui.page=0;render(true)}
  else if(a==='home'){ui.tab='calc';ui.view='home';ui.sel=null;ui.qs='';ui.cat=-1;ui.page=0;ui.msg='';ui.resetArmed=false;ui.delArmed=false;render()}
  else if(a==='sort'){ui.sort=id;store.sort=id;save();ui.page=0;render(true)}
  else if(a==='gcid'){const v=(document.getElementById('cid').value||'').trim();if(/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)){try{localStorage.setItem('mici:cid',v)}catch(e){}ui.msg='Identifiant enregistré.'}else ui.msg='Identifiant invalide : il se termine par .apps.googleusercontent.com.';render(true)}
  else if(a==='gmenu'){ui.gmenu=!ui.gmenu;refreshGbar()}
  else if(a==='gconnect'||a==='gsync'){ui.gmenu=false;refreshGbar();syncNow(true)}
  else if(a==='gdisc'){gDisconnect()}
  else if(a==='gdelonline'){if(!ui.delArmed){ui.delArmed=true;render(true);return}ui.delArmed=false;gDeleteOnline()}
  else if(a==='pg'){ui.page=Math.max(0,(ui.page||0)+(+b.dataset.d));document.getElementById('list').innerHTML=listHTML();window.scrollTo(0,0)}
  else if(a==='pp'){const it=ui.plate[+b.dataset.i];it.p=+b.dataset.v;it.g=0;savePlate();render(true)}
  else if(a==='rm'){ui.plate.splice(+b.dataset.i,1);savePlate();if(!ui.plate.length)ui.view='list';render(true)}
  else if(a==='clearPlate'){ui.plate=[];savePlate();ui.view='list';ui.note='';ui.ress=7;render()}
  else if(a==='cancelMealEdit'){ui.mealEditId=null;ui.plate=[];savePlate();ui.view='home';ui.note='';ui.ress=7;ui.tab=ui.mealEditReturn==='journal'?'journal':'calc';ui.msg='';render()}
  else if(a==='saveEntry'){
    const items=plateItems();if(!items.length)return;
    const r=scoreOf(items,ui),now=Date.now(),savedItems=items.map(x=>({id:x.f.id,n:x.f.n,p:x.p,g:x.g||0}));
    if(ui.mealEditId){const existing=store.entries.find(x=>String(x.id)===String(ui.mealEditId));if(!existing){ui.mealEditId=null;ui.msg='Ce repas n’existe plus dans le journal. Enregistre-le comme un nouveau repas si nécessaire.';render(true);return}existing.items=savedItems;existing.r=ui.ress;existing.jeun=ui.jeun;existing.note=ui.note.trim();existing.L=r.lv.L;existing.score=r.score;existing.edited=now;}
    else store.entries.push({id:now,ts:now,items:savedItems,r:ui.ress,jeun:ui.jeun,note:ui.note.trim(),L:r.lv.L,score:r.score});
    const wasEditing=!!ui.mealEditId,returnTab=ui.mealEditReturn;save();ui.plate=[];savePlate();ui.view='home';ui.note='';ui.ress=7;ui.mealEditId=null;ui.tab=wasEditing?(returnTab==='journal'?'journal':'calc'):'journal';ui.msg='';render();
  }
  else if(a==='editEntry'){const e=store.entries.find(x=>String(x.id)===id);if(e){ui.editId=e.id;ui.eR=e.r;ui.eNote=e.note||''}render(true)}
  else if(a==='cancelEdit'){ui.editId=null;render(true)}
  else if(a==='saveEdit'){const e=store.entries.find(x=>String(x.id)===id);if(e){e.r=ui.eR;e.note=(ui.eNote||'').trim();e.edited=Date.now()}ui.editId=null;save();render(true)}
  else if(a==='delEntry'){store.del=store.del||{};store.del[id]=Date.now();store.entries=store.entries.filter(x=>String(x.id)!==id);save();render(true)}
  else if(a==='saveOv'){store.over[id]=ui.ov;save();ui.msg='Correction enregistrée.';render(true)}
  else if(a==='useMean'){store.over[id]=Math.round(+b.dataset.v*2)/2;ui.ov=store.over[id];save();ui.msg='Moyenne appliquée.';render(true)}
  else if(a==='resetOv'){delete store.over[id];save();const f=byId(id);ui.ov=f?Math.round(single(f)*2)/2:5;ui.msg='Calcul rétabli.';render(true)}
  else if(a==='newfood'){ui.view='add';ui.msg='';ui.newName=ui.qs.trim();ui.newCat=Math.max(0,ui.cat);ui.newL=[0,0,0,0,0,0,0];ui.newB=0;render()}
  else if(a==='saveFood'){
    const name=ui.newName.trim();
    if(!name){ui.msg='Saisis un nom.';render(true);return}
    const nid='perso-'+Date.now();
    store.custom.push({id:nid,n:name,c:ui.newCat,L:ui.newL.slice(),b:ui.newB});
    save();ui.qs='';ui.msg='';openDetail(nid);
  }
  else if(a==='delFood'){
    store.del=store.del||{};store.del[id]=Date.now();store.custom=store.custom.filter(x=>x.id!==id);delete store.over[id];if(store.flags)delete store.flags[id];ui.plate=ui.plate.filter(x=>x.id!==id);savePlate();save();ui.view='list';render();
  }
  else if(a==='flag'){
    const v=b.dataset.v;store.flags=store.flags||{};
    if(v==='none'){delete store.flags[id];ui.msg='Statut retiré. La correction de score éventuelle reste : tu peux la rétablir.'}
    else{
      store.flags[id]=v;
      if(v==='confirm'){
        const f=byId(id),st=foodStats().find(x=>x.id===id);
        if(f&&st&&store.over[id]==null){store.over[id]=Math.max(0,Math.round(Math.min(single(f),st.mean)*2)/2);ui.ov=store.over[id];ui.msg='Confirmé : score corrigé à '+fmt(store.over[id])+' (modifiable plus bas).'}
        else ui.msg='Confirmé.';
      }else ui.msg='Écarté de la liste des suspects.';
    }
    save();render(true);
  }
  else if(a==='theme'){store.theme=id;save();applyTheme();render(true)}
  else if(a==='layout'){store.layout=id;save();applyTheme();render(true)}
  else if(a==='applySens'){store.sens[b.dataset.k]=+b.dataset.v;save();render(true)}
  else if(a==='share'){const url='https://johunn.github.io/mici-score/',d={title:'MICI Score',text:'MICI Score : estimation personnelle de la tolérance alimentaire. Ni diagnostic ni traitement.',url};if(navigator.share){navigator.share(d).catch(()=>{})}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>{ui.msg='Lien copié.';render(true);setTimeout(()=>{if(ui.msg==='Lien copié.'){ui.msg='';render(true)}},2500)},()=>{ui.msg='Copie impossible. Lien : '+url;render(true)})}else{ui.msg='Lien : '+url;render(true)}}
  else if(a==='onbNext'){if(ui.onb){ui.onb.step=Math.min(3,ui.onb.step+1);drawOnb()}}
  else if(a==='onbBack'){if(ui.onb){ui.onb.step=Math.max(1,ui.onb.step-1);drawOnb()}}
  else if(a==='onbPick'){if(ui.onb){ui.onb.sel=id;drawOnb()}}
  else if(a==='onbSten'){if(ui.onb){ui.onb.sten=!ui.onb.sten;drawOnb()}}
  else if(a==='onbPous'){if(ui.onb){ui.onb.pous=!ui.onb.pous;drawOnb()}}
  else if(a==='onbSkip'){store.onb=true;save();hideOnb()}
  else if(a==='onbDone'){
    const o=ui.onb,cur=ONB_OPT.find(x=>x.id===(o&&o.sel))||ONB_OPT[3];
    store.prof=cur.prof;store.mods=store.mods||{};store.mods.crohn=!!cur.crohn;store.mods.sten=!!(o&&o.sten);
    store.onb=true;save();hideOnb();render();
  }
  else if(a==='onbOpen'){showOnb()}
  else if(a==='prof'){store.prof=id;save();render(true)}
  else if(a==='mod'){store.mods=store.mods||{};store.mods[id]=!store.mods[id];save();render(true)}
  else if(a==='resetSens'){store.sens={};save();render(true)}
  else if(a==='export'){
    const txt=backupText();
    const done=()=>{ui.exportText='';ui.msg='Sauvegarde copiée.';render(true)},fail=()=>showBackupCopyFallback(txt);
    try{navigator.clipboard.writeText(txt).then(done,fail)}catch(err){fail()}
  }
  else if(a==='selectBackup'){
    const el=document.getElementById('backupOut');
    if(el){el.focus();el.select()}
  }
  else if(a==='import'){
    const raw=(document.getElementById('imp').value||'').trim();
    let restored;
    try{
      if(raw.length>8000000)throw new Error('backup-too-large');
      restored=norm(validateBackup(JSON.parse(raw)));
    }catch(err){
      ui.msg=err&&err.message==='backup-too-large'
        ?'Sauvegarde trop volumineuse (limite : 8 Mo). Aucune donnée n’a été modifiée.'
        :'Sauvegarde invalide ou incompatible. Aucune donnée n’a été modifiée.';
      const status=document.getElementById('profileStatus');
      if(status){status.textContent=ui.msg;status.style.display='block'}
      return;
    }
    const previousStore=store,previousPlate=ui.plate,previousExportText=ui.exportText;
    restored.acct=store.acct;
    restored.del={};
    restored.ep=Date.now();
    restored.mt=Date.now();
    restored.plate=[];
    store=restored;
    ui.plate=[];store.plate=[];
    if(!save()){
      store=previousStore;ui.plate=previousPlate;ui.exportText=previousExportText;
      ui.msg='Impossible d’enregistrer la sauvegarde dans ce navigateur. Aucune donnée n’a été modifiée.';
      const status=document.getElementById('profileStatus');
      if(status){status.textContent=ui.msg;status.style.display='block'}
      return;
    }
    try{localStorage.setItem(PLATE_KEY,'[]')}catch(e){}
    ui.exportText='';ui.view='list';ui.editId=null;
    applyTheme();ui.msg='Sauvegarde restaurée.';
    render(true);
  }
  else if(a==='reset'){
    if(!ui.resetArmed){ui.resetArmed=true;render(true);return}
    {const ac=store.acct;store=norm({});store.acct=ac;store.ep=Date.now();store.mt=Date.now()}save();applyTheme();ui.plate=[];savePlate();ui.exportText='';ui.resetArmed=false;ui.msg='Données effacées.';render(true);
  }
});

document.getElementById('brand').innerHTML='MICI Score'+RIB;
applyTheme();
render();
syncInit();
maybeOnb();
})();
